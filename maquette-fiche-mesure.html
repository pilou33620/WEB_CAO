<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maquette fiche de mesure</title>
<!-- shortcut: maquette autonome avec une carte inventée ; l'intégration réelle passera par 29/34-draftsman.js -->
<style>
:root{--fond:#e6e9ed;--panneau:#fff;--txt:#1d2329;--bord:#c9d0d7;--doux:#5b6670;--err:#c62828}
@media (prefers-color-scheme:dark){:root{--fond:#16191d;--panneau:#22272d;--txt:#e3e7eb;--bord:#3a424b;--doux:#9aa5af;--err:#ff6b6b}}
*{box-sizing:border-box}
body{margin:0;font:14px system-ui,sans-serif;background:var(--fond);color:var(--txt);display:flex;gap:14px;padding:14px;min-height:100vh}
@media (max-width:900px){body{flex-direction:column;padding:10px 16px}}
aside{flex:0 0 330px;background:var(--panneau);border:1px solid var(--bord);border-radius:6px;padding:14px;align-self:flex-start}
main{flex:1;min-width:0}
h1{font-size:16px;margin:0 0 4px}
p.aide{color:var(--doux);font-size:12px;margin:0 0 10px;line-height:1.4}
label{display:block;margin:8px 0 3px;font-size:12px;color:var(--doux)}
input,select{width:100%;padding:6px;border:1px solid var(--bord);border-radius:4px;font:inherit;background:var(--panneau);color:var(--txt)}
input.actif{outline:2px solid #1565c0}
.ligne{display:flex;gap:8px}.ligne>div{flex:1;min-width:0}
button{margin-top:12px;width:100%;padding:8px;border:0;border-radius:4px;background:#1565c0;color:#fff;font:inherit;cursor:pointer}
.err{color:var(--err);font-size:12px;min-height:16px;margin-top:6px}
ul{list-style:none;padding:0;margin:12px 0 0}
li{display:flex;align-items:center;gap:8px;padding:6px;border-top:1px solid var(--bord);font-size:13px}
li b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;color:#fff;font-size:11px}
li span{flex:1}
li button{margin:0;width:auto;padding:2px 8px;background:transparent;color:var(--doux);border:1px solid var(--bord)}
svg#feuille{width:100%;height:auto;display:block;background:#fff;box-shadow:0 2px 10px #0004}
svg text{font-family:Arial,Helvetica,sans-serif}
.vue-carte .num{display:none}
.vue-detail .ref{display:none}
[data-p]{cursor:pointer}
</style></head>
<body>
<aside>
  <h1>Fiche de mesure — mode semi-auto</h1>
  <p class="aide">Tape « repère.pastille » (ex. <code>U3.12</code>, <code>TP2</code>, <code>J1-3</code>) ou clique une pastille sur la vue de la carte : elle remplit le champ actif. Chaque point reçoit un cercle repère sur la carte et une vue de détail agrandie.</p>
  <div class="ligne">
    <div><label for="a">Sonde + (rouge)</label><input id="a" list="pads" value="U3.12" autocomplete="off"></div>
    <div><label for="b">Sonde − (noire)</label><input id="b" list="pads" value="C6.2" autocomplete="off"></div>
  </div>
  <datalist id="pads"></datalist>
  <div class="ligne">
    <div><label for="type">Mesure</label>
      <select id="type"><option>Tension DC</option><option>Résistance</option><option>Continuité</option><option>Oscilloscope</option></select></div>
    <div><label for="ech">Échelle détail</label>
      <select id="ech"><option value="auto">auto</option><option>2</option><option>3</option><option>5</option><option>10</option></select></div>
  </div>
  <div class="ligne">
    <div><label for="att">Attendu</label><input id="att" value="3,3 V"></div>
    <div><label for="tol">Tolérance</label><input id="tol" value="± 5 %"></div>
  </div>
  <label for="note">Note pour le technicien</label><input id="note" value="Sous tension, J1 alimenté en 5 V">
  <button id="ajout">Ajouter la mesure</button>
  <div class="err" id="err"></div>
  <ul id="liste"></ul>
</aside>
<main><svg id="feuille" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg"></svg></main>
<script>
"use strict";
/* ---- une carte inventée (mm, Y vers le bas) ---- */
const COMPS=[], NETS={"U3.8":"GND","TP1.1":"GND","U1.4":"GND","C5.2":"GND","U3.12":"+3V3","C6.1":"+3V3",
  "C6.2":"GND","TP2.1":"+3V3","U1.8":"+5V","J1.1":"+5V","J1.2":"GND","R12.1":"SDA","R12.2":"+3V3",
  "U3.20":"SDA","TP3.1":"SDA","TP4.1":"+5V","J1.3":"SDA","J1.4":"SCL","U3.21":"SCL"};
function comp(ref,x,y,pads,corps){COMPS.push({ref,x,y,pads,corps});}
function qfp(ref,x,y){
  const p=0.8,L=2.8,e=4.2,pads=[];let k=1;
  for(let i=0;i<8;i++)pads.push({n:k++,dx:-e,dy:-L+i*p,w:1.5,h:0.45});
  for(let i=0;i<8;i++)pads.push({n:k++,dx:-L+i*p,dy:e,w:0.45,h:1.5});
  for(let i=0;i<8;i++)pads.push({n:k++,dx:e,dy:L-i*p,w:1.5,h:0.45});
  for(let i=0;i<8;i++)pads.push({n:k++,dx:L-i*p,dy:-e,w:0.45,h:1.5});
  comp(ref,x,y,pads,{w:7,h:7});
}
function soic(ref,x,y){
  const pads=[];
  for(let i=0;i<4;i++)pads.push({n:i+1,dx:-2.7,dy:-1.905+i*1.27,w:1.6,h:0.6});
  for(let i=0;i<4;i++)pads.push({n:i+5,dx:2.7,dy:1.905-i*1.27,w:1.6,h:0.6});
  comp(ref,x,y,pads,{w:3.9,h:4.9});
}
function chip(ref,x,y,vert){
  comp(ref,x,y,vert?[{n:1,dx:0,dy:-0.8,w:0.9,h:0.8},{n:2,dx:0,dy:0.8,w:0.9,h:0.8}]
                   :[{n:1,dx:-0.8,dy:0,w:0.8,h:0.9},{n:2,dx:0.8,dy:0,w:0.8,h:0.9}],vert?{w:0.8,h:1.6}:{w:1.6,h:0.8});
}
function tp(ref,x,y){comp(ref,x,y,[{n:1,dx:0,dy:0,w:1.5,h:1.5,rond:true}],null);}
function conn(ref,x,y,n){
  const pads=[];for(let i=0;i<n;i++)pads.push({n:i+1,dx:0,dy:i*2.54,w:1.7,h:1.7,rond:i>0,trou:1});
  comp(ref,x,y,pads,{w:2.54,h:n*2.54,dy:(n-1)*1.27});
}
qfp("U3",45,30); soic("U1",20,45); chip("C5",30,20,false); chip("C6",56,25,true); chip("R12",70,45,false);
conn("J1",90,25,4); tp("TP1",10,10); tp("TP2",38,55); tp("TP3",60,60); tp("TP4",80,10);
const PISTES=[[[10,10],[20,10],[30,20.8],[30,21.5]],[[40.8,30],[34,30],[34,40],[22.7,47]],
  [[49.2,31.2],[56,31.2],[56,25.8]],[[90,27.54],[80,27.54],[71,37],[70.8,45]],[[40.8,27.6],[38,24],[38,55]]];

const PADS=new Map();   // "U3.12" -> pastille en coordonnées carte
for(const c of COMPS)for(const p of c.pads){
  const cle=c.ref+"."+p.n;
  PADS.set(cle,{cle,ref:c.ref,n:p.n,x:c.x+p.dx,y:c.y+p.dy,w:p.w,h:p.h,rond:p.rond,trou:p.trou,net:NETS[cle]||""});
}
document.getElementById("pads").innerHTML=[...PADS.keys()].map(k=>`<option value="${k}">`).join("");

/* « u3-12 », « U3 12 », « U3:12 », « TP2 » (une seule pastille) */
function resoudre(txt){
  const m=String(txt).trim().toUpperCase().match(/^([A-Z]+\d+)(?:\s*[.\-: ]\s*(\w+))?$/);
  if(!m)return {err:`« ${txt} » : attendu repère.pastille, ex. U3.12`};
  const c=COMPS.find(c=>c.ref===m[1]);
  if(!c)return {err:`Composant ${m[1]} introuvable`};
  if(!m[2]){
    if(c.pads.length===1)return {p:PADS.get(c.ref+".1")};
    return {err:`${c.ref} a ${c.pads.length} pastilles : précise laquelle (${c.ref}.1 … ${c.ref}.${c.pads.length})`};
  }
  const p=PADS.get(c.ref+"."+m[2]);
  return p?{p}:{err:`${c.ref} n'a pas de pastille ${m[2]}`};
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COUL=["#c62828","#1565c0","#2e7d32"];

function carteSvg(surbrillance){
  const ns=' vector-effect="non-scaling-stroke"';
  let s=`<rect x="0" y="0" width="100" height="70" rx="2" fill="none" stroke="#000" stroke-width="0.35"${ns}/>`;
  for(const [x,y] of [[4,4],[96,4],[4,66],[96,66]])s+=`<circle cx="${x}" cy="${y}" r="1.6" fill="none" stroke="#000" stroke-width="0.25"${ns}/>`;
  for(const t of PISTES)s+=`<polyline points="${t.join(" ")}" fill="none" stroke="#c9c9c9" stroke-width="0.25" stroke-linecap="round"/>`;
  for(const c of COMPS){
    if(c.corps)s+=`<rect x="${c.x-c.corps.w/2}" y="${c.y+(c.corps.dy||0)-c.corps.h/2}" width="${c.corps.w}" height="${c.corps.h}" fill="none" stroke="#888" stroke-width="0.12" stroke-dasharray="0.6 0.4"${ns}/>`;
    s+=`<text class="ref" x="${c.x}" y="${c.y+(c.corps?(c.corps.dy||0)-c.corps.h/2-1.2:-1.6)}" font-size="1.6" text-anchor="middle" fill="#555">${c.ref}</text>`;
  }
  for(const p of PADS.values()){
    const h=surbrillance.get(p.cle), rempl=h||"#fff";
    s+=p.rond?`<circle data-p="${p.cle}" cx="${p.x}" cy="${p.y}" r="${p.w/2}" fill="${rempl}" stroke="#000" stroke-width="0.15"${ns}/>`
             :`<rect data-p="${p.cle}" x="${p.x-p.w/2}" y="${p.y-p.h/2}" width="${p.w}" height="${p.h}" fill="${rempl}" stroke="#000" stroke-width="0.15"${ns}/>`;
    if(p.trou)s+=`<circle cx="${p.x}" cy="${p.y}" r="${p.trou/2}" fill="#000" pointer-events="none"/>`;
    s+=`<text class="num" x="${p.x}" y="${p.y+0.12}" font-size="0.32" text-anchor="middle" fill="${h?"#fff":"#333"}" pointer-events="none">${p.n}</text>`;
  }
  return s;
}

/* ---- la feuille ---- */
const MES=[
  {a:"U3.12",b:"C6.2",type:"Tension DC",att:"3,3 V",tol:"± 5 %",ech:"auto",note:"Sous tension, J1 alimenté en 5 V"},
  {a:"TP1",b:"U3.8",type:"Continuité",att:"< 1 Ω",tol:"",ech:"auto",note:"Hors tension"},
  {a:"R12.1",b:"R12.2",type:"Résistance",att:"4,7 kΩ",tol:"± 1 %",ech:"auto",note:"Hors tension, pull-up SDA"},
];
const R=16, ORIG={x:22,y:26};       // rayon des détails sur la feuille ; coin de la carte à l'échelle 1:1
const CENTRES=[[172,46],[215,46],[258,46],[172,104],[215,104],[258,104]];

function details(){
  const out=[];let lettre=65;
  MES.slice(0,3).forEach((m,i)=>{
    const pa=resoudre(m.a).p, pb=resoudre(m.b).p, couleur=COUL[i];
    const d=Math.hypot(pa.x-pb.x,pa.y-pb.y);
    // deux points voisins : un seul détail qui montre les deux
    const groupes=d<=5?[[pa,pb]]:[[pa],[pb]];
    for(const g of groupes){
      const cx=g.reduce((s,p)=>s+p.x,0)/g.length, cy=g.reduce((s,p)=>s+p.y,0)/g.length;
      const ext=Math.max(...g.map(p=>Math.hypot(p.x-cx,p.y-cy)+Math.max(p.w,p.h)/2));
      const k=m.ech!=="auto"?+m.ech:([5,4,3,2].find(k=>ext*k<=R*0.35)||2);
      out.push({lettre:String.fromCharCode(lettre++),m:i,couleur,pts:g,cx,cy,k,pa});
    }
  });
  return out;
}

function dessiner(){
  const det=details(), surb=new Map();
  MES.slice(0,3).forEach((m,i)=>{surb.set(resoudre(m.a).p.cle,COUL[i]);surb.set(resoudre(m.b).p.cle,"#222");});
  const carte=carteSvg(surb);
  let s=``;
  // cadre + zones
  s+=`<rect x="5" y="5" width="287" height="200" fill="none" stroke="#000" stroke-width="0.5"/><rect x="10" y="10" width="277" height="190" fill="none" stroke="#000" stroke-width="0.25"/>`;
  for(let i=0;i<6;i++)s+=`<text x="${10+277*(i+0.5)/6}" y="8.6" font-size="2.5" text-anchor="middle">${i+1}</text>`;
  for(let i=0;i<4;i++)s+=`<text x="7.5" y="${10+190*(i+0.5)/4+1}" font-size="2.5" text-anchor="middle">${"ABCD"[i]}</text>`;
  // vue de la carte
  s+=`<g class="vue-carte" transform="translate(${ORIG.x} ${ORIG.y})">${carte}`;
  MES.slice(0,3).forEach((m,i)=>{
    const pa=resoudre(m.a).p, pb=resoudre(m.b).p, mx=(pa.x+pb.x)/2, my=(pa.y+pb.y)/2-4;
    s+=`<line x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}" stroke="${COUL[i]}" stroke-width="0.25" stroke-dasharray="1 0.6"/>
        <line x1="${mx}" y1="${my+2}" x2="${(pa.x+pb.x)/2}" y2="${(pa.y+pb.y)/2}" stroke="${COUL[i]}" stroke-width="0.2"/>
        <circle cx="${mx}" cy="${my}" r="2.2" fill="#fff" stroke="${COUL[i]}" stroke-width="0.35"/>
        <text x="${mx}" y="${my+1}" font-size="2.8" font-weight="bold" text-anchor="middle" fill="${COUL[i]}">${i+1}</text>`;
  });
  for(const d of det){
    const r=R/d.k;
    s+=`<circle cx="${d.cx}" cy="${d.cy}" r="${r}" fill="none" stroke="#000" stroke-width="0.3" stroke-dasharray="2 0.6 0.4 0.6"/>
        <text x="${d.cx-r*0.75}" y="${d.cy-r*0.75-0.6}" font-size="3" font-weight="bold" text-anchor="end">${d.lettre}</text>`;
  }
  s+=`</g><text x="${ORIG.x+50}" y="${ORIG.y+79}" font-size="3" font-weight="bold" text-anchor="middle">VUE DE DESSUS — ÉCHELLE 1:1</text>`;
  // vues de détail
  det.forEach((d,j)=>{
    if(j>=CENTRES.length)return;
    const [X,Y]=CENTRES[j];
    s+=`<clipPath id="c${j}"><circle cx="${X}" cy="${Y}" r="${R}"/></clipPath>
        <g clip-path="url(#c${j})"><g class="vue-detail" transform="translate(${X} ${Y}) scale(${d.k}) translate(${-d.cx} ${-d.cy})">${carte}</g></g>
        <circle cx="${X}" cy="${Y}" r="${R}" fill="none" stroke="#000" stroke-width="0.5"/>`;
    for(const p of d.pts){
      const px=X+(p.x-d.cx)*d.k, py=Y+(p.y-d.cy)*d.k, plus=p===d.pa, c=plus?d.couleur:"#222";
      // la sonde : une flèche qui vient de l'extérieur, posée sur la pastille
      const ang=plus?-2.3:-0.8, ox=px+Math.cos(ang)*9, oy=py+Math.sin(ang)*9;
      s+=`<line x1="${ox}" y1="${oy}" x2="${px+Math.cos(ang)*(Math.max(p.w,p.h)/2*d.k+0.8)}" y2="${py+Math.sin(ang)*(Math.max(p.w,p.h)/2*d.k+0.8)}" stroke="${c}" stroke-width="0.45"/>
          <circle cx="${ox}" cy="${oy}" r="2.3" fill="${c}"/>
          <text x="${ox}" y="${oy+1.2}" font-size="3.4" font-weight="bold" text-anchor="middle" fill="#fff">${plus?"+":"−"}</text>
          <circle cx="${px}" cy="${py}" r="${Math.max(p.w,p.h)/2*d.k+0.8}" fill="none" stroke="${c}" stroke-width="0.3"/>`;
    }
    const pts=d.pts.map(p=>`${p.cle}${p.net?" ("+p.net+")":""}`).join(" / ");
    s+=`<text x="${X}" y="${Y+R+4.2}" font-size="2.8" font-weight="bold" text-anchor="middle">DÉTAIL ${d.lettre} — ÉCHELLE ${d.k}:1</text>
        <text x="${X}" y="${Y+R+7.6}" font-size="2.3" text-anchor="middle" fill="${d.couleur}">Mesure ${d.m+1} · ${esc(pts)}</text>`;
  });
  // tableau des mesures
  const cols=[["N°",10],["Sonde +",33],["Sonde −",33],["Mesure",28],["Attendu",24],["Tol.",20],["Détails",18],["Note",94]];
  let y=136;
  const ligne=(cells,gras)=>{let x=18;cells.forEach((c,i)=>{
    s+=`<rect x="${x}" y="${y}" width="${cols[i][1]}" height="7" fill="${gras?"#eee":"none"}" stroke="#000" stroke-width="0.2"/>
        <text x="${x+1.5}" y="${y+4.7}" font-size="2.6" ${gras?'font-weight="bold"':""} fill="${c.coul||"#000"}">${esc(c.t??c)}</text>`;x+=cols[i][1];});y+=7;};
  ligne(cols.map(c=>c[0]),true);
  MES.slice(0,3).forEach((m,i)=>{
    const pa=resoudre(m.a).p, pb=resoudre(m.b).p;
    ligne([{t:i+1,coul:COUL[i]},`${pa.cle} ${pa.net}`,`${pb.cle} ${pb.net}`,m.type,m.att,m.tol||"—",
           det.filter(d=>d.m===i).map(d=>d.lettre).join(", "),m.note]);
  });
  // consignes + cartouche
  const hors=MES.slice(0,3).some(m=>/Résistance|Continuité/.test(m.type)), sous=MES.slice(0,3).some(m=>/Tension|Oscillo/.test(m.type));
  s+=`<text x="18" y="172" font-size="2.8" font-weight="bold">CONSIGNES</text>
      <text x="18" y="177" font-size="2.4">1. Mesures dans l'ordre du tableau${hors&&sous?" : d'abord hors tension (Ω, continuité), puis sous tension.":"."}</text>
      <text x="18" y="181" font-size="2.4">2. Sonde rouge (+) sur le point coloré, sonde noire (−) sur le point noir.</text>
      <text x="18" y="185" font-size="2.4">3. Noter la valeur lue ; hors tolérance → ne pas poursuivre, prévenir le bureau d'études.</text>`;
  s+=`<g stroke="#000" stroke-width="0.25" fill="none"><rect x="187" y="170" width="100" height="30"/><line x1="187" y1="180" x2="287" y2="180"/><line x1="187" y1="190" x2="287" y2="190"/><line x1="247" y1="180" x2="247" y2="200"/></g>
      <text x="237" y="176.6" font-size="3.6" font-weight="bold" text-anchor="middle">FICHE DE MESURE — CONTRÔLE</text>
      <text x="189" y="186" font-size="2.6">Carte : DEMO-001 rév. A</text><text x="249" y="186" font-size="2.6">Feuille 1 / 1</text>
      <text x="189" y="196" font-size="2.6">Dessiné : B.E.</text><text x="249" y="196" font-size="2.6">26/10/2026</text>`;
  if(MES.length>3)s+=`<text x="148" y="200" font-size="2.4" fill="#c62828" text-anchor="middle">${MES.length-3} mesure(s) de plus → feuille suivante (non dessinée dans la maquette)</text>`;
  document.getElementById("feuille").innerHTML=s;
  document.getElementById("liste").innerHTML=MES.map((m,i)=>
    `<li><b style="background:${COUL[i]||"#888"}">${i+1}</b><span>${esc(m.a)} → ${esc(m.b)} · ${esc(m.type)} ${esc(m.att)}</span><button data-sup="${i}" aria-label="Supprimer la mesure ${i+1}">✕</button></li>`).join("");
}

/* ---- interactions ---- */
const $=id=>document.getElementById(id);
let actif=$("a");
for(const id of ["a","b"])$(id).addEventListener("focus",e=>{actif.classList.remove("actif");actif=e.target;actif.classList.add("actif");});
actif.classList.add("actif");
$("feuille").addEventListener("click",e=>{
  const p=e.target.closest("[data-p]");if(!p)return;
  actif.value=p.dataset.p;
  actif=actif.id==="a"?$("b"):$("a");actif.focus();
});
$("ajout").addEventListener("click",()=>{
  const ra=resoudre($("a").value), rb=resoudre($("b").value);
  const err=ra.err||rb.err||(ra.p.cle===rb.p.cle?"Les deux sondes sont sur la même pastille":"");
  $("err").textContent=err;
  if(err)return;
  MES.push({a:ra.p.cle,b:rb.p.cle,type:$("type").value,att:$("att").value,tol:$("tol").value,ech:$("ech").value,note:$("note").value});
  dessiner();
});
$("liste").addEventListener("click",e=>{const i=e.target.dataset.sup;if(i!=null){MES.splice(+i,1);dessiner();}});
// auto-test du parseur
console.assert(resoudre("u3-12").p.cle==="U3.12"&&resoudre("TP2").p.cle==="TP2.1"&&resoudre("U3").err&&resoudre("U9.1").err&&resoudre("U3.99").err);
dessiner();
</script>
</body></html>
