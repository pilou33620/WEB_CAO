<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éditeur schématique — Dashboard nocturne</title>
<link rel="stylesheet" href="css/editeur.css">
<link rel="stylesheet" href="../commun/workspace.css">
</head>
<body>

<header>
  <div class="brand"><i></i><b>Éditeur schématique</b><span>V1.7 · BOÎTIERS</span></div>
  <div class="tools">
    <button class="tb" onclick="window.location.href='/editeur-pcb/'" style="color: var(--blue); border-color: var(--blue);">➔ Éditeur PCB</button>
    <div class="sep"></div>
    <button class="tb on" id="mSelect">Sélection <kbd>V</kbd></button>
    <button class="tb" id="mWire">Fil <kbd>W</kbd></button>
    <button class="tb" id="mErase">Gomme <kbd>X</kbd></button>
    <div class="sep"></div>
    <button class="tb" id="bRot">Pivoter <kbd>R</kbd></button>
    <button class="tb" id="bMir">Miroir <kbd>M</kbd></button>
    <button class="tb" id="bDup">Dupliquer <kbd>D</kbd></button>
    <button class="tb" id="bCopy">Copier <kbd>Ctrl+C</kbd></button>
    <button class="tb" id="bPaste">Coller <kbd>Ctrl+V</kbd></button>
    <button class="tb" id="bDel">Supprimer <kbd>Suppr</kbd></button>
    <button class="tb" id="bDelW" title="Supprimer les fils de la sélection, sans toucher aux composants">Supprimer les fils <kbd>U</kbd></button>
    <div class="sep"></div>
    <button class="tb" id="bUndo">↶ Annuler</button>
    <button class="tb" id="bRedo">↷ Rétablir</button>
    <div class="sep"></div>
    <button class="tb" id="bGrid">Grille</button>
    <select class="tbsel" id="selGrid" title="Pas d'accrochage de la grille"></select>
    <button class="tb on" id="bNets">Nets : tous <kbd>N</kbd></button>
    <button class="tb" id="bFit">Recadrer</button>
    <div class="sep"></div>
    <button class="tb" id="bWs">Espace de travail ▾</button>
    <div class="sep"></div>
    <button class="tb" id="bSave">Enregistrer .json</button>
    <button class="tb" id="bOpen">Ouvrir</button>
    <button class="tb" id="bPng">Exporter .png</button>
    <button class="tb" id="bNetlist">Netlist .txt</button>
    <button class="tb" id="bCsv">Nomenclature .csv</button>
    <button class="tb" id="bNew">Nouveau</button>
  </div>
  <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
</header>

<div id="tabs"></div>

<main id="ws">
  <div class="dock" id="dockL"></div>
  <div class="gut gv" data-dock="dockL"></div>

  <div class="ctr" id="ctr">
    <div id="canvasWrap"><canvas id="sheet"></canvas></div>
    <div class="gut gh" data-dock="dockB"></div>
    <div class="dock" id="dockB"></div>
  </div>

  <div class="gut gv" data-dock="dockR"></div>
  <div class="dock" id="dockR"></div>
</main>

<div id="pnlStore" hidden>
  <section class="pnl" data-pnl="palette" data-title="Bibliothèque">
    <header class="pnl-head">
      <span class="pnl-grip">⠿</span><span class="pnl-title">Bibliothèque</span>
      <span class="pnl-acts">
        <button class="pnl-btn" data-act="collapse" title="Replier">▾</button>
        <button class="pnl-btn" data-act="float" title="Détacher / rattacher">⬒</button>
        <button class="pnl-btn" data-act="close" title="Fermer">✕</button>
      </span>
    </header>
    <div class="pnl-body">
      <div class="scroll" id="palette"></div>
    </div>
  </section>

  <section class="pnl" data-pnl="props" data-title="Propriétés">
    <header class="pnl-head">
      <span class="pnl-grip">⠿</span><span class="pnl-title">Propriétés</span>
      <span class="pnl-acts">
        <button class="pnl-btn" data-act="collapse" title="Replier">▾</button>
        <button class="pnl-btn" data-act="float" title="Détacher / rattacher">⬒</button>
        <button class="pnl-btn" data-act="close" title="Fermer">✕</button>
      </span>
    </header>
    <div class="pnl-body"><div id="props"></div></div>
  </section>

  <section class="pnl" data-pnl="list" data-title="Nomenclature &amp; Nets">
    <header class="pnl-head">
      <span class="pnl-grip">⠿</span><span class="pnl-title">Nomenclature &amp; Nets</span>
      <span class="pnl-acts">
        <button class="pnl-btn" data-act="collapse" title="Replier">▾</button>
        <button class="pnl-btn" data-act="float" title="Détacher / rattacher">⬒</button>
        <button class="pnl-btn" data-act="close" title="Fermer">✕</button>
      </span>
    </header>
    <div class="pnl-body">
      <div class="pnl-bar">
        <span class="seg">
          <button class="segb on" id="tabBom">Nomenclature</button>
          <button class="segb" id="tabNets">Nets</button>
        </span>
        <label id="bomAllWrap" style="margin-left:auto; display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:9.5px; color:var(--txt-dim);"><input type="checkbox" id="bomAll" style="accent-color:var(--blue); margin:0;"> tout le doc.</label>
        <label id="netAllWrap" style="margin-left:auto; display:none; align-items:center; gap:5px; font-family:var(--mono); font-size:9.5px; color:var(--txt-dim);"><input type="checkbox" id="netAll" style="accent-color:var(--blue); margin:0;"> tout le doc.</label>
      </div>
      <div class="scroll" id="bom"></div>
    </div>
  </section>
</div>

<div id="floatLayer"></div>
<div id="dropZone"></div>
<div id="dragGhost"></div>

<footer>
  <span>Feuille <b id="fPage">1/1</b></span>
  <span>Mode <b id="fMode">Sélection</b></span>
  <span>X <b id="fX">0</b> · Y <b id="fY">0</b></span>
  <span>Zoom <b id="fZoom">100%</b></span>
  <span>Grille <b id="fGrid">1 carré = 2,54 mm</b></span>
  <span>Composants <b id="fN">0</b> · Fils <b id="fW">0</b> · Nets <b id="fNets">0</b></span>
  <span>Net <b id="fNet">—</b></span>
  <span class="push hint" id="fHint">Clic sur un composant de la bibliothèque puis clic sur la feuille pour le poser.</span>
</footer>


<!-- =============================================================================
     Scripts classiques, chargés dans l'ordre : tout le code partage la même
     portée globale, exactement comme dans la version d'origine en un seul
     fichier. L'ordre compte (les constantes avant leurs utilisateurs, le
     démarrage en dernier) : ne pas réorganiser sans raison.
     Pas de type="module" à dessein — la page reste ouvrable en double-clic,
     directement depuis le disque (file://), sans serveur web.
     ============================================================================= -->
<script src="js/00-espace-config.js"></script>
<script src="js/01-noyau.js"></script>
<script src="js/02-bibliotheque.js"></script>
<script src="js/03-boitiers.js"></script>
<script src="js/04-etat.js"></script>
<script src="js/05-feuilles.js"></script>
<script src="js/06-rendu-fond.js"></script>
<script src="js/07-connectivite.js"></script>
<script src="js/08-rendu-schema.js"></script>
<script src="js/09-interaction.js"></script>
<script src="js/10-actions.js"></script>
<script src="js/11-palette.js"></script>
<script src="js/12-panneaux.js"></script>
<script src="js/13-fichiers.js"></script>
<script src="js/14-clavier-boutons.js"></script>
<script src="js/15-import.js"></script>
<script src="js/16-demo.js"></script>
<script src="js/17-demarrage.js"></script>
<script src="js/18-csv.js"></script>
<script src="js/19-broches.js"></script>
<script src="../commun/workspace.js"></script>
</body>
</html>
