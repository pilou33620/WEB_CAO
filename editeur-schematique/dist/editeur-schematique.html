/* Bloc « net » du panneau : nom modifiable, liste des nœuds, sélection du net.
   Le nom est stocké comme label sur un segment (w.net) — comme une étiquette
   posée sur le fil dans un outil du métier. Un symbole d'alimentation ou une
   étiquette de net l'emporte : le champ est alors en lecture seule. */
function netBlock(net){
  if(!net)return "";
  const imposed = net.src>=2;
  const srcTxt = net.global?"symbole global (alimentation ou étiquette globale)"
                          :"étiquette de net";
  const nodes = net.nodes.slice()
    .sort((a,b)=>String(a.ref).localeCompare(String(b.ref),"fr",{numeric:true}))
    .map(n=>n.ref+"."+n.pin+(n.label?" ("+n.label+")":""));
  let h='<div class="prop"><label>Net</label>'+
    '<input id="pNet" value="'+esc(net.named?net.name:"")+'" '+
    'placeholder="'+esc(net.name)+(net.named?"":" (auto)")+'" '+
    (imposed?'disabled ':'')+'>'+
    '<div class="row"><button class="tb" id="pNetSel">Sélectionner le net</button></div></div>';
  const g=docGroupOf(net);
  h+='<div class="pinnote">'+
     (net.global
       ? "<b>Net global</b> : présent sur "+(g?sheetList(g.pages):"cette feuille")+
         " — le même nom relie les feuilles.<br>"
       : "Net local à cette feuille. Pour le faire communiquer avec une autre "+
         "feuille, posez une <b>étiquette globale</b>.<br>")+
     (imposed?"Nom fourni par le "+srcTxt+" : modifiez la valeur du symbole pour le renommer.<br>"
             :"Saisir un nom pose une étiquette sur le fil ; vider le champ rend le net anonyme.<br>")+
     (net.conflict?'<span class="warn">Conflit de noms : '+esc(net.names.join(" / "))+'</span><br>':"")+
     '<b>'+nodes.length+(nodes.length>1?" nœuds":" nœud")+'</b>'+
     (nodes.length?" : "+esc(nodes.join(" · ")):"")+
     (net.powers.length?"<br>"+net.powers.length+" symbole(s) d'alimentation / étiquette(s).":"")+
     '</div>';
  return h;
}
function wireInfo(wires){
  const total=wires.reduce((s,w)=>s+Math.abs(w.x2-w.x1)+Math.abs(w.y2-w.y1),0)/G;
  const len=(Math.round(total*10)/10)+" pas";
  const N=nets(), own=new Set();
  for(const w of wires){const n=N.byWire.get(w);if(n)own.add(n);}
  const netHtml = own.size===1 ? netBlock([...own][0])
    : own.size>1 ? '<div class="prop"><label>Nets</label><input value="'+own.size+' nets" disabled></div>'
    : "";
  if(wires.length>1){
    return '<div class="prop"><label>Sélection</label>'+
      '<input value="'+wires.length+' fils" disabled></div>'+
      netHtml+
      '<div class="prop"><label>Longueur cumulée</label><input value="'+len+'" disabled>'+
      '<div class="row"><button class="tb" id="pDel">Supprimer</button></div></div>'+
      '<div class="pinnote">Glisser un fil le déplace ; les segments raccordés à ses '+
      'extrémités s\'étirent pour rester connectés.</div>';
  }
  const w=wires[0];
  const dir=(w.x1===w.x2)?"Fil vertical":(w.y1===w.y2)?"Fil horizontal":"Fil oblique";
  const pt=(x,y)=>Math.round(x/G)+" , "+Math.round(y/G);
  return '<div class="prop"><label>Sélection</label><input value="'+dir+'" disabled></div>'+
    netHtml+
    '<div class="prop"><label>Départ (pas de grille)</label><input value="'+esc(pt(w.x1,w.y1))+'" disabled></div>'+
    '<div class="prop"><label>Arrivée</label><input value="'+esc(pt(w.x2,w.y2))+'" disabled></div>'+
    '<div class="prop"><label>Longueur</label><input value="'+len+'" disabled>'+
    '<div class="row"><button class="tb" id="pDel">Supprimer</button></div></div>'+
    '<div class="pinnote">Saisir une poignée d\'extrémité étire le segment ; '+
    'saisir le milieu déplace le fil entier. Ctrl+glisser détache le fil de ses voisins.</div>';
}
/* Sélecteur de boîtier en deux temps : la base (SOIC, SOT-23, 0603…) puis le
   brochage. Bases conseillées pour le type de symbole en tête de liste, et ✓
   sur celles qui existent dans le brochage du symbole. */
function pkgField(el){
  const cur=el.pkg||"";
  const known=pkgKnown(cur);
  const custom=!!cur&&!known;
  const parsed=known?pkgBaseOf(cur):null;
  const base=parsed?parsed.base:null;
  const n=pinCount(el);

  let h='<div class="prop"><label>Boîtier</label><select id="pPkgB">'+
    '<option value=""'+(cur?"":" selected")+'>— aucun —</option>';
  for(const g of pkgBaseList(el)){
    h+='<optgroup label="'+esc(g.fam)+'">';
    for(const x of g.bases)
      h+='<option value="'+esc(x.base.b)+'"'+(base===x.base?" selected":"")+'>'+
         esc(x.base.b)+(x.fit?" ✓":"")+
         (x.base.note?" — "+esc(x.base.note):"")+'</option>';
    h+='</optgroup>';
  }
  h+='<option value="__custom"'+(custom?" selected":"")+'>Personnalisé…</option></select>';

  // deuxième menu : brochage de la base retenue
  const pins=pkgPinsFor(base,el);
  const show=pins.length>0;
  h+='<select id="pPkgN" style="margin-top:6px'+(show?"":";display:none")+'">';
  if(show){
    if(base.free&&parsed&&parsed.pins&&!pins.includes(parsed.pins))
      h+='<option value="'+parsed.pins+'" selected>'+parsed.pins+' broches</option>';
    for(const v of pins)
      h+='<option value="'+v+'"'+((parsed&&parsed.pins===v)?" selected":"")+'>'+
         v+' broches'+(v===n?" ✓":"")+'</option>';
    if(base.free)h+='<option value="__free">autre nombre…</option>';
  }
  h+='</select>';
  h+='<input id="pPkgFree" type="number" min="1" max="4000" placeholder="nombre de billes"'+
     ' style="margin-top:6px;display:none">';
  h+='<input id="pPkgTxt" placeholder="ex. SOD-123, TO-3" value="'+esc(custom?cur:"")+'"'+
     ' style="margin-top:6px'+(custom?"":";display:none")+'">';
  h+='</div>';

  if(base&&base.flat&&n!==2)
    h+='<div class="pinnote"><span class="warn">'+esc(base.b)+' est un boîtier à '+
       '2 bornes, le symbole en a '+n+'.</span></div>';
  else if(parsed&&parsed.pins&&n&&parsed.pins!==n)
    h+='<div class="pinnote"><span class="warn">'+esc(cur)+' a '+parsed.pins+
       ' broches, le symbole en a '+n+'.</span> Volontaire ? sinon prenez un '+
       'brochage marqué ✓.</div>';
  else if(cur&&!known)
    h+='<div class="pinnote">Boîtier hors bibliothèque : conservé tel quel dans la '+
       'nomenclature et la netlist.</div>';
  return h;
}
function bindPkgField(el){
  const bs=document.getElementById("pPkgB");
  if(!bs)return;
  const ns=document.getElementById("pPkgN"),
        fr=document.getElementById("pPkgFree"),
        tx=document.getElementById("pPkgTxt");
  const set=v=>{
    if(v)el.pkg=String(v).slice(0,40);else delete el.pkg;
    buildList();
  };
  const baseOf=()=>PKG_BASES.find(b=>b.b===bs.value)||null;
  bs.onchange=()=>{
    tx.style.display="none";fr.style.display="none";
    if(bs.value==="__custom"){
      ns.style.display="none";
      tx.style.display="";tx.focus();
      set(tx.value);
      return;
    }
    const b=baseOf();
    if(!b){ns.style.display="none";set("");refreshPanels();return;}
    // brochage retenu : celui du symbole s'il existe, sinon le premier proposé
    const pins=pkgPinsFor(b,el);
    const n=pinCount(el);
    const pick=pins.includes(n)?n:pins[0];
    set(pkgName(b,pick));
    refreshPanels();          // le second menu se reconstruit pour la nouvelle base
  };
  if(ns)ns.onchange=()=>{
    const b=baseOf();
    if(!b)return;
    if(ns.value==="__free"){
      fr.style.display="";fr.value=pinCount(el)||"";fr.focus();
      if(fr.value)set(pkgName(b,+fr.value));
      return;
    }
    fr.style.display="none";
    set(pkgName(b,+ns.value));
    refreshPanels();
  };
  if(fr)fr.oninput=()=>{
    const b=baseOf();
    const v=Math.max(1,Math.min(4000,Math.round(+fr.value||0)));
    if(b&&v)set(pkgName(b,v));
  };
  if(tx)tx.oninput=()=>set(tx.value);
}
function refreshPanels(){

    if(typeof def.pins==="function"){

              : g.n>=24

    };
    box.querySelectorAll(".pinrow input").forEach(inp=>{

    // -- Logique de recherche CSV --

            const q = searchInp.value.toLowerCase();
            let matches = [];
            for(const item of window.CSV_LIB) {

                // Filtre strict sur le type de composant avec mapping étendu
                if (def.p) {
                    const refPrefix = (item["Reference designator Prefix"] || "").trim().toUpperCase();
                    
                    // Table de correspondance (schéma -> CSV)
                    const prefixMap = {
                        "R": ["R"],
                        "RV": ["R", "RV"],
                        "C": ["C"],
                        "L": ["L"],
                        "T": ["T", "L"],
                        "Y": ["Y"],
                        "F": ["F"],
                        "D": ["D", "LED", "ESD"],
                        "V": ["V"], // Varistance
                        "Q": ["Q"],
                        "U": ["U", "IC"],
                        "BT": ["BATT", "HLC", "BT"],
                        "SW": ["SW"],
                        "K": ["K"],
                        "M": ["M"], // Mire / Moteur
                        "MECA": ["MECA", "LOC"], // Trous / Mécanique
                        "ST": ["ST"], // Strap
                        "FLT": ["FLT"], // Filtre
                        "BZ": ["BZ"],
                        "LA": ["LA"],
                        "E": ["A", "E", "ANT"],
                        "J": ["J", "JP", "HRS"],
                        "TP": ["PTST", "TP"]
                    };
                    
                    const allowed = prefixMap[def.p.toUpperCase()] || [def.p.toUpperCase()];
                    if (!allowed.includes(refPrefix)) {
                        continue;
                    }
                }
                
                const txt = (item["Part Name"] + " " + item["Description"] + " " + item["Value"] + " " + item["Part Number"]).toLowerCase();
                if (txt.includes(q)) matches.push(item);
            }
            listSel.innerHTML = "";
            for(const m of matches) {
                const opt = document.createElement("option");
                opt.value = m["Part Name"];
                opt.textContent = m["Part Name"] + " | " + m["Value"] + " | " + m["Part Number"];
                opt.dataset.val = m["Value"];
                opt.dataset.pkg = m["Package type"];
                opt.dataset.mpn = m["Part Number"];
                listSel.appendChild(opt);
            }
        };
        updateList();
        searchInp.oninput = updateList;
        listSel.onchange = () => {
            const opt = listSel.options[listSel.selectedIndex];
            if (!opt) return;
            push();
            el.csvPartName = opt.value;
            el.csvMpn = opt.dataset.mpn;
            if (opt.dataset.val) el.value = opt.dataset.val;
            if (opt.dataset.pkg && opt.dataset.pkg !== "xx") {
                el.pkg = opt.dataset.pkg;
            }
            refreshPanels(); 
            draw();
        };
    }
    // ---------------------------------
  }
  buildList();
}
/* Broche par broche : à quel net chaque patte du composant est raccordée. */
function connList(el){
  const ps=allPins(el);
  if(!ps.length)return "";
  let h='<div class="panel-head">Connexions</div><div class="pins">';
  ps.forEach((p,i)=>{
    const n=netAt(p.x,p.y);
    const live=isRealNet(n);
    h+='<div class="pinrow"><span class="pn">'+(i+1)+'</span>'+
       (live
         ? '<span class="netcell" data-net="'+esc(n.id)+'" style="color:'+netColor(n)+'"'+
           ' title="Cliquer pour sélectionner le net">'+esc(n.name)+'</span>'
         : '<span class="netcell none">non connecté</span>')+
       '</div>';
  });
  return h+'</div>';
}
function netById(id){return nets().list.find(n=>n.id===id)||null;}
function bindNetCells(box){
  box.querySelectorAll(".netcell[data-net]").forEach(cell=>{
    cell.onclick=()=>selectNet(netById(cell.dataset.net));

function bindNetBlock(wires){
  const inp=document.getElementById("pNet");
  const btn=document.getElementById("pNetSel");
  if(!inp&&!btn)return;
  const N=nets(), own=new Set();
  for(const w of wires){const n=N.byWire.get(w);if(n)own.add(n);}
  if(own.size!==1)return;
  const net=[...own][0];
  if(btn)btn.onclick=()=>selectNet(net);
  // onchange (et non oninput) : une frappe ne doit pas remplir l'historique
  if(inp&&!inp.disabled)inp.onchange=()=>{
    setNetName(net,inp.value);
    refreshPanels();draw();
  };
}
/* ---------- panneau : nomenclature ou liste des nets ---------- */
function setListTab(t){

/* Vue document : une ligne par net, les nets globaux fusionnés entre feuilles. */
function buildNetsDoc(box){
  const D=docNets();
  if(!D.groups.length){
    box.innerHTML='<div class="empty">Aucun net dans le document.</div>';
    return;
  }
  let html='<table class="bom"><thead><tr><th>Net</th><th>Feuilles</th>'+
           '<th style="text-align:right">Nœuds</th></tr></thead><tbody>';
  for(const g of D.groups){
    const col=netColor({named:true,name:g.name});
    html+='<tr data-g="'+esc(g.name)+'" data-page="'+g.pages[0]+'" '+
      'title="'+esc(g.global?("Net global — "+sheetList(g.pages)):"Net local à la feuille "+(g.pages[0]+1))+'">'+
      '<td class="net'+(g.conflict?" warn":"")+'">'+
        '<span class="dot" style="background:'+(g.global?col:"#8b919c")+'"></span>'+
        (g.global?"⇄ ":"")+esc(g.name)+(g.conflict?" ⚠":"")+'</td>'+
      '<td style="color:var(--txt-dim);font-family:var(--mono);font-size:10px">'+
        esc(sheetList(g.pages))+'</td>'+
      '<td class="n">'+g.nodes.length+'</td></tr>';
  }
  html+='</tbody></table>';
  const multi=D.groups.filter(g=>g.pages.length>1);
  html+='<div class="pinnote" style="padding-top:10px">'+
    D.groups.length+' net(s) dans le document, '+multi.length+' à cheval sur plusieurs feuilles.'+
    '<br>⇄ = net global (masse, alimentation, étiquette globale) : le nom suffit à relier les feuilles.'+
    '<br>Clic sur une ligne : ouvre la feuille et sélectionne le net.'+
    '</div>';
  box.innerHTML=html;
  box.querySelectorAll("tr[data-g]").forEach(tr=>{
    tr.onclick=()=>{
      const pg=+tr.dataset.page;
      if(pg!==S.page)gotoPage(pg);
      const n=nets().list.find(x=>x.name===tr.dataset.g);
      if(n)selectNet(n);else draw();
    };
  });
}
function buildNets(){
  const box=document.getElementById("bom");
  if(S.netAll)return buildNetsDoc(box);
  const N=nets();
  if(!N.list.length){
    box.innerHTML='<div class="empty">Aucun net sur cette feuille. Reliez des '+
      'composants avec l\'outil Fil (<b>W</b>) : les nets se construisent tout seuls.</div>';
    return;
  }
  // nets nommés d'abord, puis les anonymes dans l'ordre de numérotation
  const list=N.list.slice().sort((a,b)=>
    (a.named!==b.named) ? (a.named?-1:1)
    : String(a.name).localeCompare(String(b.name),"fr",{numeric:true}));
  let html='<table class="bom"><thead><tr><th>Net</th><th>Source</th>'+
           '<th style="text-align:right">Nœuds</th></tr></thead><tbody>';
  for(const n of list){
    const src=n.global?"globale":n.src===2?"étiq.":n.src===1?"label":"auto";
    const g=docGroupOf(n);
    const tip=n.conflict?("Conflit : "+n.names.join(" / "))
      :g?("Net global — "+sheetList(g.pages)):n.name;
    html+='<tr data-net="'+esc(n.id)+'" title="'+esc(tip)+'">'+
      '<td class="net'+(n.conflict?" warn":"")+'">'+
        '<span class="dot" style="background:'+netColor(n)+'"></span>'+
        (n.global?"⇄ ":"")+esc(n.name)+(n.conflict?" ⚠":"")+'</td>'+
      '<td style="color:var(--txt-dim)">'+src+
        (g&&g.pages.length>1?' <span style="font-family:var(--mono);font-size:9px;opacity:.6">'+
          esc(sheetList(g.pages))+'</span>':"")+'</td>'+
      '<td class="n">'+n.nodes.length+'</td></tr>';
  }
  html+='</tbody></table>';
  const dangling=N.loose.reduce((a,n)=>a+n.nodes.length,0);
  const conflicts=N.list.filter(n=>n.conflict).length;
  html+='<div class="pinnote" style="padding-top:10px">'+
    N.list.length+' net(s) sur la feuille.'+
    (dangling?'<br><span class="warn">'+dangling+' broche(s) en l\'air.</span>':"")+
    (conflicts?'<br><span class="warn">'+conflicts+' net(s) à noms multiples.</span>':"")+
    '<br>Clic sur une ligne : sélectionne les fils du net. Survol : halo sur la feuille.'+
    '</div>';
  box.innerHTML=html;
  box.querySelectorAll("tr[data-net]").forEach(tr=>{
    const n=netById(tr.dataset.net);
    tr.onclick=()=>selectNet(n);
    tr.onmouseenter=()=>{S.hoverNet=n;draw();};
    tr.onmouseleave=()=>{if(S.hoverNet===n){S.hoverNet=null;draw();}};
  });
}
function buildBom(){
  const box=document.getElementById("bom");
  const list=[];
  if(S.bomAll){
    S.pages.forEach((p,i)=>{
      const src=(i===S.page)?S.comps:(p.comps||[]);
      for(const c of src) if(!defOf(c.type).noRef) list.push({c,page:i});
    });
  }else{
    for(const c of S.comps) if(!defOf(c.type).noRef) list.push({c,page:S.page});
  }
  if(!list.length){
    box.innerHTML='<div class="empty">La nomenclature se remplit à mesure que vous posez des composants.</div>';
    return;
  }
  // String() : un fichier importé peut porter un repère absent, localeCompare planterait
  list.sort((a,b)=>String(a.c.ref||"").localeCompare(String(b.c.ref||""),"fr",{numeric:true}));
  let html='<table class="bom"><thead><tr><th>Rep.</th><th>Composant</th>'+
           '<th style="text-align:right">Valeur</th></tr></thead><tbody>';
  for(const {c,page} of list){
    const sheet=S.bomAll?' <span style="font-family:var(--mono);font-size:9px;opacity:.55">f'+(page+1)+'</span>':"";
    html+='<tr data-id="'+c.id+'" data-page="'+page+'"><td class="r">'+esc(c.ref||"—")+sheet+'</td>'+
          '<td>'+esc(defOf(c.type).n)+
            (c.pkg?'<span class="pkgcell">'+esc(c.pkg)+'</span>':"")+
          '</td><td class="v">'+esc(c.value||"")+'</td></tr>';
  }
  box.innerHTML=html+"</tbody></table>";
  box.querySelectorAll("tr[data-id]").forEach(tr=>{
    tr.onclick=()=>{
      const pg=+tr.dataset.page;
      if(pg!==S.page)gotoPage(pg);
      clearSel();S.sel.add(+tr.dataset.id);
      refreshPanels();draw();
    };
  });
}
function esc(s){
  return String(s).replace(/[&<>"'`]/g,ch=>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;","`":"&#96;"}[ch]));
}

"use strict";

function saveJson(){
  storeCurrent();
  const doc={format:"schemedit-2",pages:S.pages,page:S.page};
  const blob=new Blob([JSON.stringify(doc,null,1)],{type:"application/json"});
  dl(blob,"schema.json");
  S.dirty=false;            // le travail est sur disque : plus d'alerte à la fermeture
  clearBackup();
  document.getElementById("fHint").textContent="Document enregistré dans schema.json.";
}
function dl(blob,name){
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function exportPng(){
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  for(const el of S.comps){const b=bbox(el);x1=Math.min(x1,b.x1);y1=Math.min(y1,b.y1);x2=Math.max(x2,b.x2);y2=Math.max(y2,b.y2);}
  for(const w of S.wires){x1=Math.min(x1,w.x1,w.x2);y1=Math.min(y1,w.y1,w.y2);x2=Math.max(x2,w.x1,w.x2);y2=Math.max(y2,w.y1,w.y2);}
  if(x1>x2){alert("Feuille vide : rien à exporter.");return;}
  const pad=50, sc=2, W=(x2-x1+pad*2)*sc, H=(y2-y1+pad*2)*sc;
  const o=document.createElement("canvas");o.width=W;o.height=H;
  const c=o.getContext("2d");
  c.fillStyle=C_BG;c.fillRect(0,0,W,H);
  c.setTransform(sc,0,0,sc,-(x1-pad)*sc,-(y1-pad)*sc);
  drawWires(c);
  drawJunctions(c);
  for(const el of S.comps) drawComp(c,el,false);
  drawNetLabels(c,true);          // le zoom écran ne doit pas décider de l'export
  o.toBlob(b=>{
    if(!b){alert("Export impossible : image trop grande pour le navigateur.");return;}
    dl(b,"schema.png");
  });
}

function setNetLabels(v){

function cycleNetLabels(){setNetLabels(S.netLabels+1);}

function padr(s,n){s=String(s);return s+" ".repeat(Math.max(1,n-s.length));}
function byRef(a,b){return String(a.ref).localeCompare(String(b.ref),"fr",{numeric:true})||a.pin-b.pin;}
/* Netlist lisible, une section par feuille. Les nets portant le même nom sur
   plusieurs feuilles sont signalés : ils forment un net global. */
function exportNetlist(){
  storeCurrent();
  const D=docNets();
  const out=["* Netlist — Éditeur schématique",
             "* "+new Date().toLocaleString("fr-FR"),
             "* "+S.pages.length+" feuille(s) · "+D.groups.length+" net(s)",""];
  const rows=bomRows();
  if(rows.length){
    out.push("=== Composants ===");
    for(const r of rows)
      out.push("    "+padr(r.ref,8)+padr(r.value,18)+padr(r.pkg||"—",18)+
        (S.pages.length>1?"f"+r.page:""));
    out.push("");
  }
  const globals=D.groups.filter(g=>g.global);
  const multi=S.pages.length>1;
  if(globals.length){
    out.push("=== Nets globaux (masses, alimentations, étiquettes globales) ===");
    for(const g of globals){
      out.push("");
      out.push('NET "'+g.name+'"   ; '+(g.pages.length>1?"feuilles ":"feuille ")+
        g.pages.map(i=>i+1).join(", ")+(g.conflict?"   ; conflit de noms":""));
      const nodes=g.nodes.slice().sort(byRef);
      if(!nodes.length)out.push("    ; aucun composant raccordé");
      for(const nd of nodes)
        out.push("    "+padr(nd.ref+"."+nd.pin,12)+
          (multi?padr("(f"+(nd.page+1)+")",7):"")+(nd.label||""));
    }
    out.push("");
  }
  for(const sh of D.sheets){
    const locals=D.groups.filter(g=>!g.global&&g.pages[0]===sh.page);
    out.push("=== Feuille "+(sh.page+1)+" — "+sh.name+" ===");
    if(!locals.length)out.push("  (aucun net local)");
    for(const g of locals){
      const n=g.members[0].net;
      out.push("");
      out.push('NET "'+g.name+'"'+
        (n.conflict?"   ; conflit de noms : "+n.names.join(" / "):"")+
        (n.named?"":"   ; nom attribué automatiquement"));
      const nodes=g.nodes.slice().sort(byRef);
      if(!nodes.length)out.push("    ; aucun composant raccordé");
      for(const nd of nodes)
        out.push("    "+padr(nd.ref+"."+nd.pin,12)+(nd.label||""));
    }
    const loose=[];
    for(const n of sh.nets.loose) for(const nd of n.nodes) loose.push(nd);
    if(loose.length){
      out.push("");
      out.push("; broches en l'air : "+loose.sort(byRef).map(n=>n.ref+"."+n.pin).join(" "));
    }
    out.push("");
  }
  dl(new Blob([out.join("\n")],{type:"text/plain;charset=utf-8"}),"netlist.txt");
  document.getElementById("fHint").textContent="Netlist exportée dans netlist.txt.";
}

/* Nomenclature exploitable : une ligne par composant, plus un récapitulatif
   par (type, valeur, boîtier) — c'est ce regroupement qui sert à commander. */
function csvCell(v){
  const t=String(v==null?"":v);
  return /[";\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;
}
function bomRows(){
  const rows=[];
  storeCurrent();
  S.pages.forEach((p,i)=>{
    const src=(i===S.page)?S.comps:(p.comps||[]);
    for(const c of src) if(!defOf(c.type).noRef)
      rows.push({
          ref:c.ref||"", type:defOf(c.type).n, value:c.value||"", pkg:c.pkg||"", 
          page:i+1, csvMpn: c.csvMpn||"", csvPartName: c.csvPartName||""
      });
  });
  rows.sort((a,b)=>(a.page-b.page)||
    String(a.ref).localeCompare(String(b.ref),"fr",{numeric:true}));
  return rows;
}
function exportBomCsv(){
  const rows=bomRows();
  if(!rows.length){alert("Document vide : rien à exporter.");return;}
  const out=["Repère;Composant;Valeur;Boîtier;Part Number;Feuille"];
  for(const r of rows)
    out.push([r.ref,r.type,r.value,r.pkg,r.csvMpn||r.csvPartName,r.page].map(csvCell).join(";"));
  // récapitulatif : quantités par référence de commande
  const groups=new Map();
  for(const r of rows){
    const k=r.type+"|"+r.value+"|"+r.pkg+"|"+(r.csvMpn||r.csvPartName);
    if(!groups.has(k))groups.set(k,{...r,refs:[]});
    groups.get(k).refs.push(r.ref);
  }
  out.push("","Qté;Composant;Valeur;Boîtier;Part Number;Repères");
  for(const g of [...groups.values()].sort((a,b)=>b.refs.length-a.refs.length))
    out.push([g.refs.length,g.type,g.value,g.pkg,g.csvMpn||g.csvPartName,g.refs.join(" ")].map(csvCell).join(";"));
  // BOM : le point-virgule et le BOM UTF-8 pour qu'Excel ouvre proprement
  dl(new Blob(["\ufeff"+out.join("\r\n")],{type:"text/csv;charset=utf-8"}),"nomenclature.csv");
  document.getElementById("fHint").textContent=
    rows.length+" composant(s) exporté(s) dans nomenclature.csv.";
}

/* ---------- js/14-clavier-boutons.js ---------- */
/* =============================================================================
   editeur-schematique — 14-clavier-boutons.js
   Raccourcis clavier et branchement des boutons
   ============================================================================= */
"use strict";
/* ==========================================================================
   Clavier
   ========================================================================== */
let arrowStamp=0, arrowSplit=0;
window.addEventListener("keydown",e=>{
  const t=e.target;
  const tag=(t&&t.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select"||(t&&t.isContentEditable))return;
  const k=e.key.toLowerCase();
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&k==="z"){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&k==="y"){e.preventDefault();redo();return;}
  if(mod&&k==="s"){e.preventDefault();saveJson();return;}
  if(mod&&k==="a"){e.preventDefault();S.comps.forEach(c=>S.sel.add(c.id));S.wires.forEach(w=>S.selW.add(w));refreshPanels();draw();return;}
  // toute autre combinaison avec Ctrl/Cmd appartient au navigateur :
  // sans ce garde-fou, Ctrl+R faisait pivoter la sélection puis rechargeait la page
  if(mod||e.altKey)return;
  if(e.key==="PageDown"){e.preventDefault();gotoPage(S.page+1);return;}
  if(e.key==="PageUp"){e.preventDefault();gotoPage(S.page-1);return;}
  if(k==="escape"){setMode("select");S.wireStart=null;S.place=null;clearSel();setPalette(null);refreshPanels();draw();return;}
  if(k==="v"){setMode("select");return;}
  if(k==="w"){setMode("wire");return;}
  if(k==="x"){setMode("erase");return;}
  if(k==="r"){if(S.place){S.placeRot=((S.placeRot||0)+90)%360;draw();}else rotateSel();return;}
  if(k==="m"){mirrorSel();return;}
  if(k==="d"){dupSel();return;}
  if(k==="g"){setGrid(!S.showGrid);return;}
  if(k==="n"){cycleNetLabels();return;}
  if(k==="delete"||k==="backspace"){e.preventDefault();delSel();return;}
  if(k.startsWith("arrow")){
    const d={arrowleft:[-G,0],arrowright:[G,0],arrowup:[0,-G],arrowdown:[0,G]}[k];
    if(!d||!selCount())return;
    e.preventDefault();
    // une rafale de flèches ne compte que pour une entrée d'historique
    const now=Date.now();
    if(now-arrowStamp>700)push();
    arrowStamp=now;
    moveSelBy(d[0],d[1]);
    // la découpe attend la fin de la rafale : sinon on sèmerait un point de
    // coupe à chaque case traversée
    clearTimeout(arrowSplit);
    arrowSplit=setTimeout(()=>{if(resolveSplits()){refreshPanels();draw();}},450);
    return;
  }
});

/* =============================================================================
   editeur-schematique — 15-import.js
   Import JSON défensif + sauvegarde automatique
   ============================================================================= */
"use strict";
/* --------------------------------------------------------------------------
   Import : rien de ce qui vient du fichier n'est cru sur parole.
   Une rotation de 45°, une abscisse absente ou un type inconnu suffisaient à
   produire un CS[undefined] et à figer tout le rendu.
   -------------------------------------------------------------------------- */
const ROT_OK={0:1,90:1,180:1,270:1};
function num(v,d){const n=+v;return Number.isFinite(n)?n:d;}
function normComp(c,i){
  if(!c||typeof c!=="object"||!hasType(c.type))return null;
  const def=LIB[c.type];
  const el={
    id:Math.max(1,Math.round(num(c.id,i+1))),
    type:c.type,
    x:snap(num(c.x,0)), y:snap(num(c.y,0)),
    rot:ROT_OK[num(c.rot,0)]?num(c.rot,0):0,
    mir:!!c.mir,
    ref:def.noRef?"":String(c.ref==null?"":c.ref).slice(0,32),
    value:String(c.value==null?(def.v||""):c.value).slice(0,240)
  };
  if(!def.noRef){
    const pk=String(c.pkg==null?"":c.pkg).trim().slice(0,40);
    if(pk)el.pkg=pk;
    if(c.csvMpn) el.csvMpn = String(c.csvMpn).slice(0, 100);
    if(c.csvPartName) el.csvPartName = String(c.csvPartName).slice(0, 100);
  }
  if(typeof def.pins==="function"){
    el.icShape=(c.icShape==="quad")?"quad":"dip";
    el.npins=Math.max(el.icShape==="quad"?IC_QUAD_MIN:2,
                      Math.min(64,Math.round(num(c.npins,8))));
    el.pinNames=Array.isArray(c.pinNames)
      ? c.pinNames.slice(0,el.npins).map(v=>String(v==null?"":v).slice(0,32))
      : [];
  }
  return el;
}
function normWire(w){
  if(!w||typeof w!=="object")return null;
  const x1=+w.x1,y1=+w.y1,x2=+w.x2,y2=+w.y2;
  if(![x1,y1,x2,y2].every(Number.isFinite))return null;
  if(x1===x2&&y1===y2)return null;
  const o={x1,y1,x2,y2};
  const nm=String(w.net==null?"":w.net).trim().slice(0,32);
  if(nm)o.net=nm;
  return o;
}
function normPage(p,i){
  const src=(p&&typeof p==="object")?p:{};
  const comps=(Array.isArray(src.comps)?src.comps:[]).map(normComp).filter(Boolean);
  // ids uniques garantis : un uid trop bas dans le fichier créerait des doublons
  const seen=new Set();
  let maxId=0;
  for(const c of comps){
    while(seen.has(c.id))c.id++;
    seen.add(c.id);
    if(c.id>maxId)maxId=c.id;
  }
  const wires=(Array.isArray(src.wires)?src.wires:[]).map(normWire).filter(Boolean);
  splitWireArray(wires);          // un fichier importé arrive avec ses fils déjà scindés
  return {
    name:String(src.name==null?("Feuille "+(i+1)):src.name).slice(0,60)||("Feuille "+(i+1)),
    comps,
    wires,
    uid:Math.max(Math.round(num(src.uid,1))||1, maxId+1),
    scale:Math.max(.25,Math.min(4,num(src.scale,1))),
    ox:num(src.ox,0), oy:num(src.oy,0)
  };
}
function loadDoc(o){
  let raw;
  if(Array.isArray(o.pages))raw=o.pages;
  else if(Array.isArray(o.comps)||Array.isArray(o.wires))raw=[{name:"Feuille 1",comps:o.comps,wires:o.wires,uid:o.uid}];
  else throw new Error("le fichier ne contient aucun schéma");
  if(!raw.length)throw new Error("le document ne contient aucune feuille");
  const pages=raw.slice(0,200).map(normPage);
  const dropped=raw.reduce((n,p,i)=>
    n+((Array.isArray(p&&p.comps)?p.comps.length:0)-pages[i].comps.length),0);
  push();
  S.pages=pages;
  loadPage(Math.round(num(o.page,0)));
  buildTabs();refreshPanels();fit();
  return dropped;
}
document.getElementById("fileIn").onchange=e=>{
  const f=e.target.files[0];
  e.target.value="";
  if(!f)return;
  if(f.size>25*1024*1024){alert("Fichier trop volumineux (limite 25 Mo).");return;}
  const rd=new FileReader();
  rd.onerror=()=>alert("Lecture impossible : le fichier n'a pas pu être lu.");
  rd.onload=()=>{
    try{
      const dropped=loadDoc(JSON.parse(rd.result));
      document.getElementById("fHint").textContent = dropped
        ? dropped+" élément(s) ignoré(s) : type inconnu ou coordonnées invalides."
        : "Document importé.";
    }catch(err){
      alert("Lecture impossible : "+err.message);
    }
  };
  rd.readAsText(f);
};

/* --------------------------------------------------------------------------
   Filet de sécurité : sauvegarde automatique locale + confirmation de sortie
   -------------------------------------------------------------------------- */
const BAK="schemedit.autosave";
function autosave(){
  if(!S.dirty)return;
  try{
    localStorage.setItem(BAK,JSON.stringify({t:Date.now(),doc:JSON.parse(serialize())}));
  }catch(_){/* mode privé, quota plein, contexte restreint : on continue sans */}
}
function clearBackup(){try{localStorage.removeItem(BAK);}catch(_){}}
function restoreBackup(){
  try{
    const raw=localStorage.getItem(BAK);
    if(!raw)return false;
    const b=JSON.parse(raw);
    if(!b||!b.doc||!Array.isArray(b.doc.pages))return false;
    const when=new Date(b.t||Date.now()).toLocaleString("fr-FR");
    if(!confirm("Une sauvegarde automatique du "+when+" a été trouvée.\n\nLa reprendre ?")){
      clearBackup();return false;
    }
    loadDoc(b.doc);
    S.hist.length=0;S.redo.length=0;
    return true;
  }catch(_){clearBackup();return false;}
}
setInterval(autosave,4000);
window.addEventListener("beforeunload",e=>{
  autosave();
  if(!S.dirty)return;
  e.preventDefault();e.returnValue="";
});

"use strict";

window.CSV_LIB = [];

// Helper pour parser la ligne CSV (avec séparateur point-virgule)
function parseCSVLine(text) {
    let result = [];
    let cur = "";
    let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
        let char = text[i];
        if (inQuotes) {
            if (char === '"') {
                if (i + 1 < text.length && text[i + 1] === '"') {
                    cur += '"';
                    i++;
                } else {
                    inQuotes = false;
                }
            } else {
                cur += char;
            }
        } else {
            if (char === '"') {
                inQuotes = true;
            } else if (char === ';') {
                result.push(cur);
                cur = "";
            } else {
                cur += char;
            }
        }
    }
    result.push(cur);
    return result;
}

function loadCSVFromString(text, filename) {
    const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
    if (lines.length === 0) return;
    const headers = parseCSVLine(lines[0]).map(h => h.trim());
    const data = [];
    for (let i = 1; i < lines.length; i++) {
        const values = parseCSVLine(lines[i]);
        let entry = {};
        for (let j = 0; j < headers.length; j++) {
            entry[headers[j]] = values[j] ? values[j].trim() : "";
        }
        data.push(entry);
    }
    window.CSV_LIB = data;
    console.log("CSV_LIB chargé:", data.length, "composants depuis", filename);
    if (typeof refreshPanels === "function") refreshPanels();
}

function initManualCsvLoader() {
    let input = document.getElementById("csvIn");
    if (!input) {
        input = document.createElement("input");
        input.type = "file";
        input.id = "csvIn";
        input.accept = ".csv";
        input.style.display = "none";
        document.body.appendChild(input);
        
        input.onchange = e => {
            const f = e.target.files[0];
            e.target.value = "";
            if (!f) return;
            const rd = new FileReader();
            rd.onload = () => {
                loadCSVFromString(rd.result, f.name);
            };
            rd.readAsText(f);
        };
    }
}

function loadCSVLib() {
    initManualCsvLoader();
    
    const paths = [
        '../LIB_composants.csv',
        '../../LIB_composants.csv',
        '/LIB_composants.csv'
    ];
    let pathIndex = 0;
    function tryNextPath() {
        if (pathIndex >= paths.length) {
            console.warn("Impossible de charger LIB_composants.csv via HTTP (bloqué par CORS en mode fichier local ?).");
            if (typeof refreshPanels === "function") refreshPanels();
            return;
        }
        fetch(paths[pathIndex])
            .then(response => {
                if (!response.ok) throw new Error("HTTP error " + response.status);
                return response.text();
            })
            .then(text => loadCSVFromString(text, paths[pathIndex]))
            .catch(err => {
                pathIndex++;
                tryNextPath();
            });
    }
    tryNextPath();
}

loadCSVLib();
