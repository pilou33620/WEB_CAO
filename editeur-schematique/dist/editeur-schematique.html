<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éditeur schématique — Dashboard nocturne</title>
<style>
/* =============================================================================
   editeur-schematique — feuille de style (dashboard nocturne)
   ============================================================================= */
  :root{
    --bg:#0f1012;
    --panel:#17181b;
    --panel2:#1c1e22;
    --border:#2b2e34;
    --border2:#3a3e46;
    --txt:#e6e8ec;
    --txt-dim:#8b919c;
    --yellow:#f2c744;
    --blue:#3fa0ea;
    --blue-deep:#2b7fbf;
    --red:#e8443a;
    --cyan:#8af0ff;
    --mono:"JetBrains Mono","SF Mono",Consolas,"Roboto Mono",monospace;
    --ui:"Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--txt);font-family:var(--ui);
    display:flex;flex-direction:column;overflow:hidden;
  }
  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand b{font-size:15px;letter-spacing:.14em;text-transform:uppercase}
  .brand span{font-family:var(--mono);font-size:10px;color:var(--txt-dim);letter-spacing:.18em}
  .brand i{display:inline-block;width:4px;height:18px;background:var(--red);border-radius:1px;transform:translateY(3px)}
  .tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .sep{width:1px;height:22px;background:var(--border2);margin:0 4px}
  button.tb{
    background:var(--panel2);color:var(--txt);border:1px solid var(--border2);
    padding:6px 10px;border-radius:5px;font-size:12px;cursor:pointer;font-family:var(--ui);
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  button.tb:hover{border-color:var(--blue);color:#fff}
  button.tb.on{background:var(--blue-deep);border-color:var(--blue);color:#fff}
  button.tb kbd{font-family:var(--mono);font-size:9px;color:var(--txt-dim);border:1px solid var(--border2);border-radius:3px;padding:0 3px}
  button.tb.on kbd{color:#dff0ff;border-color:#5cb4f0}
  /* ---------- onglets de feuilles ---------- */
  #tabs{
    display:flex;align-items:center;gap:4px;padding:5px 10px 0;background:var(--panel2);
    border-bottom:1px solid var(--border);overflow-x:auto;flex:none;
  }
  #tabs::-webkit-scrollbar{height:6px}
  #tabs::-webkit-scrollbar-thumb{background:#31343a;border-radius:3px}
  .tab{
    display:inline-flex;align-items:center;gap:7px;padding:6px 9px;cursor:pointer;
    border:1px solid var(--border);border-bottom:none;border-radius:5px 5px 0 0;
    background:#15171a;color:var(--txt-dim);font-size:12px;white-space:nowrap;margin-bottom:-1px;
  }
  .tab:hover{color:var(--txt)}
  .tab.on{background:var(--bg);color:var(--txt);border-color:var(--border2);box-shadow:inset 0 2px 0 var(--yellow)}
  .tab .num{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--yellow);opacity:.8}
  .tab .x{font-size:13px;line-height:1;color:var(--txt-dim);opacity:0}
  .tab:hover .x,.tab.on .x{opacity:.55}
  .tab .x:hover{color:var(--red);opacity:1}
  .tabbtn{
    background:transparent;border:1px dashed var(--border2);color:var(--txt-dim);
    border-radius:5px;padding:5px 9px;font-size:12px;cursor:pointer;margin-bottom:4px;font-family:var(--ui);
  }
  .tabbtn:hover{border-color:var(--yellow);color:var(--txt)}
  /* ---------- layout ---------- */
  main{flex:1;display:flex;min-height:0}
  aside{
    width:196px;flex:none;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;min-height:0;
  }
  aside.right{width:272px;border-right:none;border-left:1px solid var(--border)}
  .panel-head{
    padding:9px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--txt-dim);border-bottom:1px solid var(--border);
  }
  .scroll{overflow-y:auto;flex:1;min-height:0}
  .scroll::-webkit-scrollbar{width:8px}
  .scroll::-webkit-scrollbar-thumb{background:#31343a;border-radius:4px}
  .cat{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--yellow);padding:10px 12px 4px;opacity:.85}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 8px 6px}
  .item{
    background:var(--panel2);border:1px solid var(--border);border-radius:6px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;padding:4px 2px 3px;transition:.12s;
  }
  .item:hover{border-color:var(--blue);background:#20242a}
  .item.on{border-color:var(--yellow);background:#241f13}
  .item canvas{display:block}
  .item span{font-size:9.5px;color:var(--txt-dim);margin-top:2px;text-align:center;line-height:1.15}
  .item:hover span,.item.on span{color:var(--txt)}
  #canvasWrap{flex:1;position:relative;min-width:0}
  canvas#sheet{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
  /* ---------- properties ---------- */
  .prop{padding:10px 12px;border-bottom:1px solid var(--border)}
  .prop label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--txt-dim);margin-bottom:4px}
  .prop input{
    width:100%;background:#101216;border:1px solid var(--border2);color:var(--txt);
    border-radius:5px;padding:6px 8px;font-family:var(--mono);font-size:12.5px;
  }
  .prop input:focus{outline:none;border-color:var(--blue)}
  .prop select{
    width:100%;background:#101216;border:1px solid var(--border2);color:var(--txt);
    border-radius:5px;padding:6px 8px;font-family:var(--mono);font-size:12.5px;
  }
  .prop select:focus{outline:none;border-color:var(--blue)}
  .prop select optgroup{color:var(--yellow);font-style:normal;font-family:var(--ui);font-size:11px}
  .prop select option{color:var(--txt);background:#101216;font-family:var(--mono)}
  .pkgcell{font-family:var(--mono);font-size:9.5px;color:var(--txt-dim);display:block;margin-top:1px}
  .row{display:flex;gap:6px;margin-top:8px}
  .row button{flex:1}
  .empty{padding:16px 12px;font-size:12px;color:var(--txt-dim);line-height:1.5}
  #props{overflow-y:auto;max-height:58vh}
  #props::-webkit-scrollbar{width:8px}
  #props::-webkit-scrollbar-thumb{background:#31343a;border-radius:4px}
  .pins{padding:8px 12px 4px}
  .pinrow{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .pinrow .pn{
    font-family:var(--mono);font-size:10px;color:var(--yellow);background:#101216;
    border:1px solid var(--border2);border-radius:4px;padding:3px 0;width:28px;
    text-align:center;flex:none;
  }
  .pinrow input{
    flex:1;min-width:0;background:#101216;border:1px solid var(--border2);color:var(--txt);
    border-radius:5px;padding:4px 7px;font-size:12px;font-family:var(--ui);
  }
  .pinrow input:focus{outline:none;border-color:var(--blue)}
  .pinnote{padding:2px 12px 12px;font-size:11px;color:var(--txt-dim);line-height:1.45}
  .panel-head.split{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .panel-head label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;letter-spacing:.08em}
  .panel-head input[type=checkbox]{accent-color:var(--blue);margin:0}
  table.bom{width:100%;border-collapse:collapse;font-size:11.5px}
  table.bom th{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--txt-dim);text-align:left;padding:6px 12px;border-bottom:1px solid var(--border)}
  table.bom td{padding:5px 12px;border-bottom:1px solid #202226;color:var(--txt)}
  table.bom td.r{font-family:var(--mono);color:var(--yellow);width:64px}
  table.bom td.v{font-family:var(--mono);color:var(--txt-dim);text-align:right}
  table.bom tr:hover td{background:#1e2126;cursor:pointer}
  /* ---------- footer ---------- */
  footer{
    display:flex;align-items:center;gap:16px;padding:5px 14px;background:var(--panel);
    border-top:1px solid var(--border);font-family:var(--mono);font-size:11px;color:var(--txt-dim);
  }
  footer b{color:var(--yellow);font-weight:600}
  footer .push{margin-left:auto}
  .hint{color:var(--txt-dim)}
  .seg{display:inline-flex;border:1px solid var(--border2);border-radius:5px;overflow:hidden}
  .segb{
    background:transparent;border:none;color:var(--txt-dim);cursor:pointer;
    font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:4px 7px;
  }
  .segb:hover{color:var(--txt)}
  .segb.on{background:var(--blue-deep);color:#fff}
  table.bom td.net{font-family:var(--mono);color:var(--txt)}
  table.bom td.net .dot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:7px}
  table.bom td.net.warn{color:var(--red)}
  .warn{color:var(--red)}
  table.bom td.n{font-family:var(--mono);color:var(--txt-dim);text-align:right;width:52px}
  .netcell{
    flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--txt);
    padding:4px 7px;border:1px solid transparent;border-radius:5px;cursor:pointer;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .netcell:hover{border-color:var(--border2);background:#101216}
  .netcell.none{color:var(--txt-dim);cursor:default}
  .netcell.none:hover{border-color:transparent;background:none}
  @media (max-width:900px){aside{width:150px}aside.right{width:190px}}
</style>
</head>
<body>

<header>
  <div class="brand"><i></i><b>Éditeur schématique</b><span>V1.7 · BOÎTIERS</span></div>
  <div class="tools">
    <button class="tb" onclick="window.location.href='/editeur-pcb/'" style="color: var(--blue); border-color: var(--blue);">➔ Éditeur PCB</button>
    <div class="sep"></div>
    <button class="tb on" id="mSelect">Sélection <kbd>V</kbd></button>
    <button class="tb" id="mWire">Fil <kbd>W</kbd></button>
    <button class="tb" id="mErase">Gomme <kbd>X</kbd></button>
    <div class="sep"></div>
    <button class="tb" id="bRot">Pivoter <kbd>R</kbd></button>
    <button class="tb" id="bMir">Miroir <kbd>M</kbd></button>
    <button class="tb" id="bDup">Dupliquer <kbd>D</kbd></button>
    <button class="tb" id="bDel">Supprimer <kbd>Suppr</kbd></button>
    <div class="sep"></div>
    <button class="tb" id="bUndo">↶ Annuler</button>
    <button class="tb" id="bRedo">↷ Rétablir</button>
    <div class="sep"></div>
    <button class="tb" id="bGrid">Grille</button>
    <button class="tb on" id="bNets">Nets : tous <kbd>N</kbd></button>
    <button class="tb" id="bFit">Recadrer</button>
    <div class="sep"></div>
    <button class="tb" id="bSave">Enregistrer .json</button>
    <button class="tb" id="bOpen">Ouvrir</button>
    <button class="tb" id="bPng">Exporter .png</button>
    <button class="tb" id="bNetlist">Netlist .txt</button>
    <button class="tb" id="bCsv">Nomenclature .csv</button>
    <button class="tb" id="bNew">Nouveau</button>
  </div>
  <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
</header>

<div id="tabs"></div>

<main>
  <aside>
    <div class="panel-head">Bibliothèque</div>
    <div class="scroll" id="palette"></div>
  </aside>

  <div id="canvasWrap"><canvas id="sheet"></canvas></div>

  <aside class="right">
    <div class="panel-head">Propriétés</div>
    <div id="props"></div>
    <div class="panel-head split" style="border-top:1px solid var(--border)">
      <span class="seg">
        <button class="segb on" id="tabBom">Nomenclature</button>
        <button class="segb" id="tabNets">Nets</button>
      </span>
      <label id="bomAllWrap"><input type="checkbox" id="bomAll"> tout le doc.</label>
      <label id="netAllWrap" style="display:none"><input type="checkbox" id="netAll"> tout le doc.</label>
    </div>
    <div class="scroll" id="bom"></div>
  </aside>
</main>

<footer>
  <span>Feuille <b id="fPage">1/1</b></span>
  <span>Mode <b id="fMode">Sélection</b></span>
  <span>X <b id="fX">0</b> · Y <b id="fY">0</b></span>
  <span>Zoom <b id="fZoom">100%</b></span>
  <span>Composants <b id="fN">0</b> · Fils <b id="fW">0</b> · Nets <b id="fNets">0</b></span>
  <span>Net <b id="fNet">—</b></span>
  <span class="push hint" id="fHint">Clic sur un composant de la bibliothèque puis clic sur la feuille pour le poser.</span>
</footer>

<!-- =============================================================================
     Scripts classiques, chargés dans l'ordre : tout le code partage la même
     portée globale, exactement comme dans la version d'origine en un seul
     fichier. L'ordre compte (les constantes avant leurs utilisateurs, le
     démarrage en dernier) : ne pas réorganiser sans raison.
     Pas de type="module" à dessein — la page reste ouvrable en double-clic,
     directement depuis le disque (file://), sans serveur web.
     ============================================================================= -->
<script>
/* ---------- js/01-noyau.js ---------- */
/* =============================================================================
   editeur-schematique — 01-noyau.js
   Constantes de style + helpers de dessin
   ============================================================================= */
"use strict";
/* ==========================================================================
   Constantes de style — reprises du schéma de référence
   ========================================================================== */
const G = 20;                       // pas de grille (px monde)
const C_BG      = "#141416";
const C_GRID    = "#232529";
const C_GRIDMAJ = "#32353c";
const C_WIRE    = "#f2c744";
const C_COMP    = "#4fa8e8";
const C_FILL    = "#2f86cc";
const C_RED     = "#e8443a";
const C_TXT     = "#ffffff";
const C_SEL     = "#8af0ff";
const C_GLOB    = "#2a7d74";        // remplissage des étiquettes globales
const HANDLE    = 4.5;              // demi-côté des poignées de fil, en pixels écran

/* ==========================================================================
   Helpers de dessin (coordonnées locales du composant)
   ========================================================================== */
function L(c,x1,y1,x2,y2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
function P(c,pts,fill){
  c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);
  c.closePath();
  if(fill){c.fillStyle=fill;c.fill();}
  c.stroke();
}
function RR(c,x,y,w,h,r,fill){
  c.beginPath();
  c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
  if(fill){c.fillStyle=fill;c.fill();}
  c.stroke();
}
function CIR(c,x,y,r,fill){
  c.beginPath();c.arc(x,y,r,0,Math.PI*2);
  if(fill){c.fillStyle=fill;c.fill();}
  c.stroke();
}
function ARR(c,x,y,ang,s,col){ // pointe de flèche pleine
  const a=ang,d=s||9;
  c.save();c.translate(x,y);c.rotate(a);
  c.beginPath();c.moveTo(0,0);c.lineTo(-d,-d*0.42);c.lineTo(-d,d*0.42);c.closePath();
  c.fillStyle=col||C_COMP;c.fill();c.restore();
}
const _meas=document.createElement("canvas").getContext("2d");
function textW(t,size,bold){
  _meas.font=(bold?"bold ":"")+(size||12)+'px "Segoe UI",system-ui,sans-serif';
  return _meas.measureText(String(t)).width;
}
// « | » sépare les lignes d'une annotation
function annotBox(el,size,padX,padY,fallback){
  const ls=String((el&&el.value)||fallback||"").split("|");
  let w=0;ls.forEach(l=>{w=Math.max(w,textW(l,size,true));});
  return {ls,w:w+padX*2,h:ls.length*(size+4)+padY*2};
}
/* Orientation du symbole en cours de tracé. Les textes internes (valeur d'une
   étiquette, numéros de broches d'un CI, « + » d'un chimique…) s'écrivent dans
   le repère du symbole : sans correction, un miroir les rend illisibles à
   l'envers et une rotation de 180° les met la tête en bas. */
let _symT=null;
function TXT(c,t,x,y,size,col,align){
  c.save();c.fillStyle=col||C_TXT;
  c.font="bold "+(size||12)+'px "Segoe UI",system-ui,sans-serif';
  c.textAlign=align||"center";c.textBaseline="middle";
  if(_symT&&(_symT.mir||_symT.rot%360)){
    // on annule le miroir, et on ramène l'angle à 0° ou 90° : les deux seules
    // orientations lisibles, comme dans les outils du métier
    const rot=((_symT.rot%360)+360)%360;
    c.translate(x,y);
    if(_symT.mir)c.scale(-1,1);
    c.rotate((rot%180-rot)*Math.PI/180);
    c.fillText(t,0,0);
  }else{
    c.fillText(t,x,y);
  }
  c.restore();
}

/* ---------- js/02-bibliotheque.js ---------- */
/* =============================================================================
   editeur-schematique — 02-bibliotheque.js
   Bibliothèque de symboles (LIB) et catégories
   ============================================================================= */
"use strict";
/* ==========================================================================
   Bibliothèque de composants
   pins : [[x,y],...] en coordonnées locales (multiples de la grille)
   ========================================================================== */
const LIB = {
/* ---------------- passifs ---------------- */
resistor:{n:"Résistance",cat:"Passifs",p:"R",v:"10k",refIn:true,pk:"passif",pkg:"0603",pins:[[-40,0],[40,0]],
  d(c){L(c,-40,0,-22,0);L(c,22,0,40,0);RR(c,-22,-11,44,22,4,C_FILL);}},
potentiometer:{n:"Potentiomètre",cat:"Passifs",p:"RV",v:"10k",refIn:true,pk:"passif",pins:[[-40,0],[40,0],[0,-40]],
  d(c){L(c,-40,0,-22,0);L(c,22,0,40,0);RR(c,-22,-11,44,22,4,C_FILL);
       L(c,0,-40,0,-22);ARR(c,0,-16,Math.PI/2,10);}},
capacitor:{n:"Condensateur",cat:"Passifs",p:"C",v:"100n",pk:"passif",pkg:"0603",pins:[[-40,0],[40,0]],
  d(c){L(c,-40,0,-7,0);L(c,7,0,40,0);c.lineWidth=4.5;L(c,-7,-17,-7,17);L(c,7,-17,7,17);c.lineWidth=3;}},
cap_pol:{n:"Chimique",cat:"Passifs",p:"C",v:"470µ",pk:"passif",pins:[[-40,0],[40,0]],
  d(c){L(c,-40,0,-8,0);L(c,8,0,40,0);c.lineWidth=4.5;L(c,-8,-17,-8,17);c.lineWidth=3;
       c.beginPath();c.arc(28,0,22,Math.PI*0.72,Math.PI*1.28);c.stroke();
       TXT(c,"+",-20,-19,14,C_TXT);}},
inductor:{n:"Bobine",cat:"Passifs",p:"L",v:"10µH",pk:"passif",pkg:"0805",pins:[[-40,0],[40,0]],
  d(c){for(let i=0;i<4;i++){c.beginPath();c.arc(-30+i*20,0,10,Math.PI,0);c.stroke();}}},
transformer:{n:"Transfo",cat:"Passifs",p:"T",v:"1:1",ext:[-40,-32,40,32],pins:[[-40,-20],[-40,20],[40,-20],[40,20]],
  d(c){L(c,-40,-20,-22,-20);L(c,-40,20,-22,20);L(c,40,-20,22,-20);L(c,40,20,22,20);
       L(c,-22,-20,-22,-18);L(c,-22,20,-22,18);L(c,22,-20,22,-18);L(c,22,20,22,18);
       for(let i=0;i<3;i++){c.beginPath();c.arc(-22,-12+i*12,6,-Math.PI/2,Math.PI/2);c.stroke();
                            c.beginPath();c.arc(22,-12+i*12,6,Math.PI/2,-Math.PI/2);c.stroke();}
       L(c,-5,-24,-5,24);L(c,5,-24,5,24);}},
crystal:{n:"Quartz",cat:"Passifs",p:"Y",v:"8MHz",pk:"passif",pins:[[-40,0],[40,0]],
  d(c){L(c,-40,0,-12,0);L(c,12,0,40,0);L(c,-12,-16,-12,16);L(c,12,-16,12,16);
       RR(c,-5,-13,10,26,2,C_FILL);}},
fuse:{n:"Fusible",cat:"Passifs",p:"F",v:"1A",pk:"passif",pins:[[-40,0],[40,0]],
  d(c){L(c,-40,0,-24,0);L(c,24,0,40,0);RR(c,-24,-11,48,22,3,null);
       c.beginPath();c.moveTo(-24,0);c.quadraticCurveTo(-8,-12,0,0);c.quadraticCurveTo(8,12,24,0);c.stroke();}},
varistor:{n:"Varistance",cat:"Passifs",p:"V",v:"VAR",pk:"passif",pins:[[-40,0],[40,0]],
  d(c){L(c,-40,0,-22,0);L(c,22,0,40,0);RR(c,-22,-11,44,22,4,C_FILL);
       L(c,-28,16,14,-16);L(c,14,-16,22,-16);}},
filter:{n:"Filtre SAW",cat:"Passifs",p:"FLT",v:"SAW",pins:[[-40,0],[40,0],[0,40]],

  tOff(el){const g=icGeom(el);return g.quad?g.hs+38:Math.max(34,-g.top+15);},
  init(el){el.npins=8;el.pinNames=[];el.icShape="dip";},
  pins(el){return icPins(el);},
  d(c,el){
    const g=icGeom(el), ps=icPins(el);
    if(g.quad){
      // corps carré, broches sur les quatre côtés, numérotation antihoraire
      RR(c,-g.hs,-g.hs,2*g.hs,2*g.hs,4,C_FILL);
      CIR(c,-g.hs+13,-g.hs+13,5,null);        // repère de la broche 1
      ps.forEach((p,i)=>{
        const t=String(i+1);

   Boîtiers (empreintes)
   Le boîtier n'est pas une donnée de schéma : c'est l'attribut qui fait le lien
   avec le routage et l'approvisionnement. Il est donc stocké sur le composant
   (el.pkg), proposé par famille selon le type de symbole, et ressort dans la
   nomenclature et la netlist.

  if(!t)return null;
  let best=null;
  for(const b of PKG_BASES){
    const u=b.b.toUpperCase(), v=t.toUpperCase();
    if(v===u){best={base:b,pins:b.flat?2:null};break;}
    if(v.startsWith(u+"-")){
      const rest=t.slice(b.b.length+1);
      if(/^\d+$/.test(rest)&&(!best||b.b.length>best.base.b.length))
        best={base:b,pins:+rest};
    }
  }
  return best;
}
function pkgName(base,n){
  if(!base)return "";
  if(base.flat)return base.b;
  return n?base.b+"-"+n:base.b;
}
// un nom est « connu » si sa base existe et si son brochage est proposé
function pkgKnown(name){
  if(!name)return true;
  const r=pkgBaseOf(name);
  if(!r)return false;
  if(r.base.flat)return String(name).trim().toUpperCase()===r.base.b.toUpperCase();
  if(r.base.free)return r.pins===null||r.pins>0;
  return r.pins!==null&&r.base.pins.includes(r.pins);
}
/* Bases classées : familles conseillées pour ce type de symbole d'abord.
   « fit » signale les bases qui existent dans le brochage du symbole. */
function pkgBaseList(el){
  const kind=defOf(el.type).pk||null, n=pinCount(el);
  const reco=[], other=[];
  for(const fam of PKG_FAMS){
    const bases=PKG_BASES.filter(b=>b.fam===fam).map(b=>({
      base:b,
      // les boîtiers à billes acceptent n'importe quel brochage : les marquer
      // « compatibles » partout ne serait qu'un bruit visuel
      fit:b.flat?(n===2):b.free?false:b.pins.includes(n)
    }));
    ((kind&&bases.some(x=>x.base.kinds.includes(kind)))?reco:other).push({fam,bases});
  }
  return reco.concat(other);
}
function pkgPinsFor(base,el){
  if(!base||base.flat)return [];
  if(base.free){
    const n=pinCount(el);
    const set=[...new Set([n,4,8,16,25,36,48,64,100,144,169,256,324,484,676].filter(
      v=>v&&v>=(base.min||1)&&v<=(base.max||9999)))];
    return set.sort((a,b)=>a-b);
  }
  return base.pins;
}

/* Accès sûr à la bibliothèque.
   LIB["__proto__"], LIB["constructor"] ou LIB["toString"] renvoient des valeurs
   héritées d'Object.prototype : un simple test de vérité les laisse passer, puis
   def.pins vaut undefined et tout le rendu meurt. On teste donc la propriété
   propre, et on remplace un type inconnu par un symbole d'erreur visible. */
function hasType(t){return Object.prototype.hasOwnProperty.call(LIB,t);}
const DEF_UNKNOWN={n:"Type inconnu",cat:"Divers",p:"X",v:"?",noRef:true,noVal:true,flat:true,
  pins:[],ext:[-26,-14,26,14],
  d(c){c.strokeStyle=C_RED;c.lineWidth=2;RR(c,-26,-14,52,28,4,null);TXT(c,"?",0,1,14,C_RED);}};
function defOf(t){return hasType(t)?LIB[t]:DEF_UNKNOWN;}

/* =============================================================================
   editeur-schematique — 04-etat.js
   État global, sélection, canvas, géométrie des symboles

"use strict";
/* ==========================================================================
   État
   ========================================================================== */
const S={
  pages:[], page:0,               // feuilles du document
  comps:[], wires:[],             // contenu de la feuille active (références)
  sel:new Set(),                  // ids des composants sélectionnés
  selW:new Set(),                 // fils sélectionnés (références directes)
  mode:"select",                  // select | wire | erase
  place:null,                     // type en cours de pose
  scale:1, ox:0, oy:0,
  showGrid:true,
  wireStart:null, mouse:{x:0,y:0}, hoverPin:null,
  drag:null, pan:null, marquee:null,
  uid:1, hist:[], redo:[],
  wireVer:0, dirty:false, bomAll:false,
  netLabels:2, hoverNet:null, listTab:"bom", netAll:false  // 0 aucune · 1 nommés · 2 tous
};
const HIST_MAX=60;
// toute modification des fils invalide le cache des jonctions
function touchWires(){S.wireVer++;}

/* ---------- sélection mixte : composants (par id) + fils (par référence) ---------- */
function clearSel(){S.sel.clear();S.selW.clear();}
function selEls(){return S.comps.filter(c=>S.sel.has(c.id));}
function selWires(){return S.wires.filter(w=>S.selW.has(w));}
function selCount(){return S.sel.size+selWires().length;}
// un fil supprimé peut rester dans selW : on écarte les références mortes
function pruneSel(){
  if(!S.selW.size)return;
  const live=new Set(S.wires);
  for(const w of S.selW) if(!live.has(w)) S.selW.delete(w);
}
const cv=document.getElementById("sheet"), ctx=cv.getContext("2d");

/* ---------- géométrie ---------- */
/* Le symbole d'un CI se dessine de deux façons, au choix :
   — « dip »  : rectangle, deux rangées. Broches 1..n : colonne gauche de haut en
                bas, puis colonne droite de bas en haut (convention DIP/SOIC).
   — « quad » : carré, quatre côtés. Numérotation antihoraire depuis le haut du
                côté gauche : gauche ↓, bas →, droite ↑, haut ← (convention
                QFP/QFN). Au-delà d'une trentaine de broches, la colonne unique
                du rectangle devient interminable : le carré reste lisible.
   Pas de 20 px dans les deux cas, pour rester sur la grille. */
function icShapeOf(el){return (el&&el.icShape==="quad")?"quad":"dip";}
const IC_QUAD_MIN=4;                 // au moins une broche par côté
function icGeom(el){
  let n=Math.max(2,Math.min(64,Math.round((el&&el.npins)||8)));
  if(icShapeOf(el)==="quad"){
    n=Math.max(IC_QUAD_MIN,n);
    // répartition dans l'ordre du brochage : gauche, bas, droite, haut
    const b=Math.floor(n/4), r=n%4;
    const cnt=[b+(r>0?1:0), b+(r>1?1:0), b+(r>2?1:0), b];
    const m=Math.max(cnt[0],cnt[1],cnt[2],cnt[3],1);
    /* Corps carré : demi-côté arrondi au pas de grille, pour que les broches
       tombent sur des multiples de 20 depuis le centre. La marge d'angle est de
       deux pas : à un seul pas, le dernier numéro d'une colonne et le premier de
       la rangée voisine se chevauchent dans le coin. Plancher à 60 pour laisser
       la valeur s'imprimer au centre. */
    const end=Math.ceil((m-1)/2)*20;          // broche la plus excentrée d'un côté
    const hs=Math.max(60,Math.ceil((end+40)/20)*20);
    return {n,quad:true,cnt,hs,d:hs+20,top:-hs,h:2*hs,mid:0,
            off:k=>-Math.floor((k-1)/2)*20};
  }
  const half=Math.ceil(n/2), r=n-half;
  const y0=-Math.floor((half-1)/2)*20;
  const top=y0-16, h=(half-1)*20+32;
  return {n,quad:false,half,r,y0,top,h,mid:y0+(half-1)*10};
}
// une seule source pour les positions : le dessin et le calcul des nets ne
// peuvent pas diverger
function icPins(el){
  const g=icGeom(el), a=[];
  if(g.quad){
    const [cL,cB,cR,cT]=g.cnt;
    let s=g.off(cL); for(let i=0;i<cL;i++)a.push([-g.d, s+i*20]);
    s=g.off(cB);     for(let i=0;i<cB;i++)a.push([s+i*20, g.d]);
    s=g.off(cR);     for(let i=0;i<cR;i++)a.push([g.d, s+(cR-1-i)*20]);
    s=g.off(cT);     for(let i=0;i<cT;i++)a.push([s+(cT-1-i)*20, -g.d]);
    return a;
  }
  for(let i=0;i<g.half;i++)a.push([-60,g.y0+i*20]);
  for(let j=0;j<g.r;j++)a.push([60,g.y0+(g.r-1-j)*20]);
  return a;
}
/* Boîtier proposé à la création, ou quand on bascule d'une représentation à
   l'autre sans y avoir touché : deux rangées → DIP, quatre côtés → le premier
   boîtier carré de la bibliothèque qui existe dans ce brochage. */
function icAutoPkg(el){
  const n=icGeom(el).n;
  if(icShapeOf(el)!=="quad")return "DIP-"+n;
  for(const b of ["QFN","LQFP","TQFP","QFP","PLCC"]){
    const base=PKG_BASES.find(x=>x.b===b);
    if(base&&base.pins&&base.pins.includes(n))return b+"-"+n;
  }
  return "QFN-"+n;
}
function pinsOf(el){
  const p=defOf(el.type).pins;
  return typeof p==="function"?p(el):p;
}
const CS={0:[1,0],90:[0,1],180:[-1,0],270:[0,-1]};
function orient(el){                     // les annotations ignorent rotation et miroir
  const def=defOf(el.type);
  return def.flat?{rot:0,mir:false}:{rot:((el.rot%360)+360)%360,mir:!!el.mir};
}
function pinPos(el,i){
  const p=pinsOf(el)[i], o=orient(el);
  let x=p[0], y=p[1];
  if(o.mir)x=-x;
  const s=CS[o.rot];
  return {x:el.x+x*s[0]-y*s[1], y:el.y+x*s[1]+y*s[0]};
}
function allPins(el){return pinsOf(el).map((_,i)=>pinPos(el,i));}
function locToWorld(el,x,y){
  const o=orient(el);
  if(o.mir)x=-x;
  const s=CS[o.rot];
  return {x:el.x+x*s[0]-y*s[1], y:el.y+x*s[1]+y*s[0]};
}
function bbox(el,margin){
  const ps=allPins(el).concat([{x:el.x,y:el.y}]);
  const def=defOf(el.type);
  const e=typeof def.ext==="function"?def.ext(el):def.ext;
  if(e){
    ps.push(locToWorld(el,e[0],e[1]),locToWorld(el,e[2],e[1]),
            locToWorld(el,e[0],e[3]),locToWorld(el,e[2],e[3]));
  }
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  for(const p of ps){x1=Math.min(x1,p.x);y1=Math.min(y1,p.y);x2=Math.max(x2,p.x);y2=Math.max(y2,p.y);}
  const m=(margin===undefined)?(def.flat?7:24):margin;
  return {x1:x1-m,y1:y1-m,x2:x2+m,y2:y2+m};
}
// boîte de sélection au clic : marge réduite pour ne pas avaler les fils voisins
function hitBox(el){return bbox(el,defOf(el.type).flat?4:9);}
function snap(v){return Math.round(v/G)*G;}
function key(x,y){return x+","+y;}

"use strict";
/* ---------- feuilles ---------- */
function newPage(name){return {name:name,comps:[],wires:[],uid:1,scale:1,ox:0,oy:0};}
function storeCurrent(){
  const p=S.pages[S.page];if(!p)return;
  p.comps=S.comps;p.wires=S.wires;p.uid=S.uid;
  p.scale=S.scale;p.ox=S.ox;p.oy=S.oy;
}
function loadPage(i){
  S.page=Math.max(0,Math.min(S.pages.length-1,i));
  const p=S.pages[S.page];
  S.comps=p.comps;S.wires=p.wires;S.uid=p.uid||1;
  S.scale=p.scale||1;S.ox=p.ox||0;S.oy=p.oy||0;
  clearSel();S.wireStart=null;S.place=null;S.drag=null;S.marquee=null;setPalette(null);
  touchWires();
}
function gotoPage(i){
  if(i===S.page||i<0||i>=S.pages.length)return;
  storeCurrent();loadPage(i);buildTabs();refreshPanels();
  const p=S.pages[S.page];
  if(!p.viewed){p.viewed=true;fit();}else draw();
}
function addPage(copyCurrent){
  push();storeCurrent();
  const p=newPage("Feuille "+(S.pages.length+1));
  if(copyCurrent){
    const src=S.pages[S.page];
    p.name=src.name+" (copie)";
    p.comps=JSON.parse(JSON.stringify(src.comps));
    p.wires=JSON.parse(JSON.stringify(src.wires));
    p.uid=src.uid;p.scale=src.scale;p.ox=src.ox;p.oy=src.oy;
  }
  S.pages.push(p);p.viewed=true;loadPage(S.pages.length-1);
  buildTabs();refreshPanels();
  if(copyCurrent)draw();else fit();
}
function removePage(i){
  if(S.pages.length===1){alert("Un document garde au moins une feuille.");return;}
  const p=S.pages[i];
  if((p.comps.length||p.wires.length)&&!confirm("Supprimer « "+p.name+" » et tout son contenu ?"))return;
  push();storeCurrent();
  S.pages.splice(i,1);
  if(i===S.page) loadPage(Math.min(S.page,S.pages.length-1));
  else if(i<S.page) S.page--;      // supprimer une autre feuille ne doit pas
  buildTabs();refreshPanels();draw(); // réinitialiser la sélection en cours
}
function renamePage(i){
  const n=prompt("Nom de la feuille :",S.pages[i].name);
  if(n===null)return;
  push();S.pages[i].name=n.trim()||S.pages[i].name;buildTabs();
}
function buildTabs(){
  const box=document.getElementById("tabs");
  box.innerHTML="";
  S.pages.forEach((p,i)=>{
    const t=document.createElement("div");
    t.className="tab"+(i===S.page?" on":"");
    t.title="Double-clic pour renommer";
    t.innerHTML='<span class="num">'+String(i+1).padStart(2,"0")+'</span><span>'+esc(p.name)+'</span>';
    const x=document.createElement("span");x.className="x";x.textContent="✕";
    x.onclick=e=>{e.stopPropagation();removePage(i);};
    t.appendChild(x);
    t.onclick=()=>gotoPage(i);
    t.ondblclick=()=>renamePage(i);
    box.appendChild(t);
  });
  const add=document.createElement("button");
  add.className="tabbtn";add.textContent="+ Feuille";add.onclick=()=>addPage(false);
  box.appendChild(add);
  const dup=document.createElement("button");
  dup.className="tabbtn";dup.textContent="Dupliquer";dup.title="Copier la feuille courante";
  dup.onclick=()=>addPage(true);
  box.appendChild(dup);
  document.getElementById("fPage").textContent=(S.page+1)+"/"+S.pages.length;
}

/* ---------- historique (document entier) ---------- */
function serialize(){
  storeCurrent();
  return JSON.stringify({pages:S.pages,page:S.page});
}
function push(snapshot){
  S.hist.push(snapshot===undefined?serialize():snapshot);
  if(S.hist.length>HIST_MAX)S.hist.shift();
  S.redo.length=0;
  S.dirty=true;
}
function restore(js){
  const o=JSON.parse(js);
  S.pages=o.pages;loadPage(o.page||0);
  buildTabs();refreshPanels();draw();
  S.dirty=true;
}
function undo(){
  if(!S.hist.length)return;
  S.redo.push(serialize());
  if(S.redo.length>HIST_MAX)S.redo.shift();
  restore(S.hist.pop());
}
function redo(){
  if(!S.redo.length)return;
  S.hist.push(serialize());
  if(S.hist.length>HIST_MAX)S.hist.shift();
  restore(S.redo.pop());
}

/* ---------- création ---------- */
// les repères doivent être uniques sur l'ensemble du document, pas seulement
// sur la feuille active, sinon on obtient deux R1 dans la même nomenclature
function usedRefs(){
  const used=new Set();
  S.pages.forEach((p,i)=>{
    const list=(i===S.page)?S.comps:(p.comps||[]);
    for(const c of list) if(c.ref) used.add(c.ref);
  });
  for(const c of S.comps) if(c.ref) used.add(c.ref);
  return used;
}
function nextRef(prefix){
  const used=usedRefs();
  let n=1;
  while(used.has(prefix+n))n++;
  return prefix+n;
}
function addComp(type,x,y){
  const def=defOf(type);
  const el={id:S.uid++,type,x:snap(x),y:snap(y),rot:0,mir:false,
            ref:def.noRef?"":nextRef(def.p),value:def.v};
  if(def.init)def.init(el);
  if(!def.noRef&&def.pkg)el.pkg=(typeof def.pkg==="function")?def.pkg(el):def.pkg;
  S.comps.push(el);
  return el;
}

/* =============================================================================
   editeur-schematique — 06-rendu-fond.js
   Rendu : cadrage, grille, fils, jonctions

"use strict";
/* ==========================================================================
   Rendu
   ========================================================================== */
function resize(){
  const r=cv.parentElement.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  cv.style.width=r.width+"px";cv.style.height=r.height+"px";
  draw();
}
function w2s(x,y){return {x:x*S.scale+S.ox, y:y*S.scale+S.oy};}
function s2w(x,y){return {x:(x-S.ox)/S.scale, y:(y-S.oy)/S.scale};}

function drawGrid(c,w,h){
  if(!S.showGrid)return;
  const step=G*S.scale;
  if(step<6)return;
  const x0=((S.ox%step)+step)%step, y0=((S.oy%step)+step)%step;
  c.lineWidth=1;
  c.strokeStyle=C_GRID;
  c.beginPath();
  for(let x=x0;x<w;x+=step){c.moveTo(Math.round(x)+.5,0);c.lineTo(Math.round(x)+.5,h);}
  for(let y=y0;y<h;y+=step){c.moveTo(0,Math.round(y)+.5);c.lineTo(w,Math.round(y)+.5);}
  c.stroke();
  const big=step*5;
  const bx=((S.ox%big)+big)%big, by=((S.oy%big)+big)%big;
  c.strokeStyle=C_GRIDMAJ;c.beginPath();
  for(let x=bx;x<w;x+=big){c.moveTo(Math.round(x)+.5,0);c.lineTo(Math.round(x)+.5,h);}
  for(let y=by;y<h;y+=big){c.moveTo(0,Math.round(y)+.5);c.lineTo(w,Math.round(y)+.5);}
  c.stroke();
}
function drawWires(c){
  c.strokeStyle=C_WIRE;c.lineWidth=3.4;c.lineCap="round";
  c.beginPath();
  for(const w of S.wires){c.moveTo(w.x1,w.y1);c.lineTo(w.x2,w.y2);}
  c.stroke();
}
let _junCache=null, _junVer=-1;
function junctions(){
  if(_junCache && _junVer===S.wireVer) return _junCache;
  const cnt=new Map(), out=new Map();
  for(const w of S.wires){
    for(const k of [key(w.x1,w.y1),key(w.x2,w.y2)]) cnt.set(k,(cnt.get(k)||0)+1);
  }
  for(const [k,n] of cnt) if(n>=3) out.set(k,1);
  // index par abscisse (fils verticaux) et par ordonnée (fils horizontaux) :
  // évite le balayage quadratique de la détection des jonctions en T
  const vert=new Map(), horiz=new Map();
  for(const w of S.wires){
    if(w.x1===w.x2){ if(!vert.has(w.x1))vert.set(w.x1,[]); vert.get(w.x1).push(w); }
    else if(w.y1===w.y2){ if(!horiz.has(w.y1))horiz.set(w.y1,[]); horiz.get(w.y1).push(w); }
  }
  for(const w of S.wires){
    for(const e of [[w.x1,w.y1],[w.x2,w.y2]]){
      const k=key(e[0],e[1]);
      if(out.has(k))continue;
      let on=false;
      for(const o of vert.get(e[0])||[]){
        if(o!==w && e[1]>Math.min(o.y1,o.y2) && e[1]<Math.max(o.y1,o.y2)){on=true;break;}
      }
      if(!on) for(const o of horiz.get(e[1])||[]){
        if(o!==w && e[0]>Math.min(o.x1,o.x2) && e[0]<Math.max(o.x1,o.x2)){on=true;break;}
      }
      if(on) out.set(k,1);
    }
  }
  _junCache=[...out.keys()].map(k=>k.split(",").map(Number));
  _junVer=S.wireVer;
  return _junCache;
}

/* ---------- js/07-connectivite.js ---------- */
/* =============================================================================
   editeur-schematique — 07-connectivite.js
   Découpe automatique des fils + extraction des nets
   ============================================================================= */
"use strict";
/* ==========================================================================
   Découpe automatique
   Une extrémité de fil déposée au milieu d'un autre segment le scinde en deux.
   Sans cela, la jonction n'est qu'un point rouge : le segment traversé reste
   d'un seul tenant et on ne peut ni le sélectionner ni le déplacer par moitié.
   ========================================================================== */
function endpointList(wires){
  const seen=new Set(), pts=[];
  for(const w of wires){
    for(const p of [[w.x1,w.y1],[w.x2,w.y2]]){
      const k=key(p[0],p[1]);
      if(!seen.has(k)){seen.add(k);pts.push({x:p[0],y:p[1]});}
    }
  }
  return pts;
}
// point strictement à l'intérieur du segment, extrémités exclues
function insideSeg(p,w){
  if((p.x===w.x1&&p.y===w.y1)||(p.x===w.x2&&p.y===w.y2))return false;
  const dx=w.x2-w.x1, dy=w.y2-w.y1;
  if((p.x-w.x1)*dy-(p.y-w.y1)*dx!==0)return false;      // pas aligné
  const t=(p.x-w.x1)*dx+(p.y-w.y1)*dy;
  return t>0 && t<dx*dx+dy*dy;
}
/* Scinde en place tous les segments du tableau traversés par une extrémité.
   onSplit(ancien, moitiéA, moitiéB) permet à l'appelant de suivre le
   remplacement — la sélection notamment. Renvoie vrai si quelque chose a bougé. */
function splitWireArray(wires,onSplit){
  const pts=endpointList(wires);
  if(pts.length<3)return false;
  // index par abscisse et ordonnée : les fils sont presque toujours orthogonaux
  const byX=new Map(), byY=new Map();
  for(const p of pts){
    if(!byX.has(p.x))byX.set(p.x,[]);
    byX.get(p.x).push(p);
    if(!byY.has(p.y))byY.set(p.y,[]);
    byY.get(p.y).push(p);
  }
  let splits=0;
  for(let i=0;i<wires.length;i++){
    if(splits>2000)break;                                // garde-fou
    const w=wires[i];
    const cand=(w.x1===w.x2)?(byX.get(w.x1)||[])
              :(w.y1===w.y2)?(byY.get(w.y1)||[])
              :pts;                                      // segment oblique : balayage complet
    let hit=null;
    for(const p of cand) if(insideSeg(p,w)){hit=p;break;}
    if(!hit)continue;
    const a={x1:w.x1,y1:w.y1,x2:hit.x,y2:hit.y};
    const b={x1:hit.x,y1:hit.y,x2:w.x2,y2:w.y2};
    if(w.net){a.net=w.net;b.net=w.net;}   // le label survit à la scission
    wires.splice(i,1,a,b);
    if(onSplit)onSplit(w,a,b);
    splits++;
    i--;            // le premier tronçon peut être traversé une seconde fois
  }
  return splits>0;
}
function resolveSplits(){
  const done=splitWireArray(S.wires,(w,a,b)=>{
    if(S.selW.delete(w)){S.selW.add(a);S.selW.add(b);}  // la sélection suit les moitiés
  });
  if(done)touchWires();
  return done;
}

/* ==========================================================================
   Nets — extraction de la connectivité
   Un net = un ensemble de points électriquement communs. Le regroupement se
   fait par union-find sur les coordonnées de grille :
     · les deux extrémités d'un fil sont dans le même net ;
     · une broche posée sur un point de fil rejoint ce net (y compris en plein
       milieu d'un segment, comme dans les outils du métier) ;
     · deux fils qui se croisent SANS extrémité commune restent indépendants —
       c'est exactement ce que montre le point de jonction rouge.
   Le nom vient d'un symbole d'alimentation, d'une étiquette de net ou d'un
   label posé sur un fil ; deux nets qui portent le même nom fusionnent, même
   sans fil entre eux (comportement des labels globaux).
   ========================================================================== */
/* Sources de nom, par priorité décroissante. « global » signifie que le nom
   porte au-delà de la feuille : deux nets qui portent ce nom sur des feuilles
   différentes sont le même net. Une étiquette locale (port) reste, elle,
   cantonnée à sa feuille — c'est la convention des outils du métier. */
const NAME_SRC={
  gnd  :{prio:3,def:"GND",global:true},
  vcc  :{prio:3,def:"VCC",global:true},
  gport:{prio:3,def:"NET",global:true},
  port :{prio:2,def:"NET"}
};
const NET_AUTO=/^N\$\d+$/i;            // nom attribué d'office : pas un vrai label
function segLen(w){return Math.abs(w.x2-w.x1)+Math.abs(w.y2-w.y1);}
function netColor(net){
  if(!net.named)return "#8b919c";
  if(/^(gnd|agnd|dgnd|0\s*v|masse)$/i.test(net.name))return "#e8746a";
  let h=0;
  for(let i=0;i<net.name.length;i++)h=(h*31+net.name.charCodeAt(i))|0;
  return "hsl("+(((h%360)+360)%360)+",66%,66%)";
}

function computeNets(comps,wires){
  const parent=new Map();
  function add(k){if(!parent.has(k))parent.set(k,k);return k;}
  function find(k){
    add(k);
    let r=k;
    while(parent.get(r)!==r)r=parent.get(r);
    while(parent.get(k)!==r){const n=parent.get(k);parent.set(k,r);k=n;}
    return r;
  }
  function uni(a,b){a=find(a);b=find(b);if(a!==b)parent.set(a,b);}

  for(const w of wires) uni(key(w.x1,w.y1),key(w.x2,w.y2));

  // index par abscisse / ordonnée : évite de tester chaque broche contre chaque fil
  const vert=new Map(), horiz=new Map();
  for(const w of wires){
    if(w.x1===w.x2){if(!vert.has(w.x1))vert.set(w.x1,[]);vert.get(w.x1).push(w);}
    else if(w.y1===w.y2){if(!horiz.has(w.y1))horiz.set(w.y1,[]);horiz.get(w.y1).push(w);}
  }
  const pinNodes=[];
  for(const el of comps){
    const def=defOf(el.type);
    allPins(el).forEach((p,i)=>{
      const k=add(key(p.x,p.y));
      pinNodes.push({el,def,i,x:p.x,y:p.y,k});
      const cand=(vert.get(p.x)||[]).concat(horiz.get(p.y)||[]);
      for(const w of cand) if(insideSeg(p,w)) uni(k,key(w.x1,w.y1));
    });
  }

  // revendications de nom
  const claims=[];
  for(const n of pinNodes){
    const src=NAME_SRC[n.el.type];
    if(!src)continue;
    claims.push({k:n.k,name:String(n.el.value||"").trim()||src.def,
                 prio:src.prio,global:!!src.global});
  }
  for(const w of wires){
    const nm=String(w.net||"").trim();
    if(nm && !NET_AUTO.test(nm))claims.push({k:key(w.x1,w.y1),name:nm,prio:1});
  }
  const first=new Map();
  for(const cl of claims){
    const kk=cl.name.toUpperCase();
    if(first.has(kk))uni(cl.k,first.get(kk));
    else first.set(kk,cl.k);
  }

  // regroupement
  const groups=new Map();
  function net(k){
    const r=find(k);
    let n=groups.get(r);
    if(!n){n={id:r,name:"",names:[],named:false,src:0,conflict:false,global:false,
              nodes:[],powers:[],wires:[],pts:[]};groups.set(r,n);}
    return n;
  }
  for(const w of wires){
    const n=net(key(w.x1,w.y1));
    n.wires.push(w);
    n.pts.push({x:w.x1,y:w.y1},{x:w.x2,y:w.y2});
  }
  for(const nd of pinNodes){
    const n=net(nd.k);
    n.pts.push({x:nd.x,y:nd.y});
    if(NAME_SRC[nd.el.type])n.powers.push(nd.el);
    else if(!nd.def.noRef)n.nodes.push({
      ref:nd.el.ref||"?", pin:nd.i+1, id:nd.el.id,
      label:(nd.el.pinNames&&nd.el.pinNames[nd.i])||"", x:nd.x, y:nd.y});
  }
  for(const cl of claims){
    const n=net(cl.k);
    if(!n.names.some(x=>x.toUpperCase()===cl.name.toUpperCase()))n.names.push(cl.name);
    if(cl.prio>n.src){n.src=cl.prio;n.name=cl.name;n.global=!!cl.global;}
  }

  // un point isolé (broche sans fil, sonde d'annotation) n'est pas un net
  const list=[], loose=[];
  for(const n of groups.values()){
    n.named=!!n.name;
    n.conflict=n.names.length>1;
    let mx=1e9,my=1e9;
    for(const p of n.pts){if(p.y<my||(p.y===my&&p.x<mx)){my=p.y;mx=p.x;}}
    n.min={x:mx,y:my};
    let best=null;
    for(const w of n.wires) if(!best||segLen(w)>segLen(best))best=w;
    n.anchor = best
      ? {x:(best.x1+best.x2)/2, y:(best.y1+best.y2)/2, vert:best.x1===best.x2}
      : (n.pts.length?{x:n.pts[0].x,y:n.pts[0].y,vert:false}:null);
    if(!n.wires.length && n.nodes.length+n.powers.length<2) loose.push(n);
    else list.push(n);
  }
  // numérotation stable : de haut en bas, puis de gauche à droite
  list.sort((a,b)=>(a.min.y-b.min.y)||(a.min.x-b.min.x));
  let auto=0;
  for(const n of list) if(!n.named)n.name="N$"+(++auto);

  const byWire=new Map(), byPoint=new Map();
  for(const n of list) for(const w of n.wires) byWire.set(w,n);
  for(const k of parent.keys()){
    const n=groups.get(find(k));
    if(n)byPoint.set(k,n);
  }
  return {list,loose,byWire,byPoint};
}

/* Cache : la signature couvre tout ce qui peut changer la connectivité — fils,
   position/orientation des composants, et valeurs des symboles nommants. */
let _netCache=null, _netSig="";
function netSig(){
  let s=S.wireVer+"|"+S.wires.length+"|"+S.page+"|"+S.comps.length;
  for(const c of S.comps)
    s+="|"+c.type+","+c.x+","+c.y+","+(c.rot|0)+(c.mir?"m":"")+(c.npins||0)+
       (c.icShape==="quad"?"q":"")+
       (NAME_SRC[c.type]?(","+c.value):"");
  for(const w of S.wires) if(w.net) s+="|@"+w.x1+","+w.y1+","+w.net;
  return s;
}
function nets(){
  const sig=netSig();
  if(_netCache && _netSig===sig)return _netCache;
  _netCache=computeNets(S.comps,S.wires);
  _netSig=sig;
  return _netCache;
}
/* ---------- vue document : les nets globaux traversent les feuilles ----------
   Le regroupement intra-feuille ne change pas ; seule l'identité change : deux
   nets portant le même nom global, sur deux feuilles, ne font qu'un. */
function pageSig(comps,wires){
  let s=comps.length+"/"+wires.length, h=0;
  for(const c of comps)
    s+="|"+c.type+","+c.x+","+c.y+","+(c.rot|0)+(c.mir?"m":"")+(c.npins||0)+
       (c.icShape==="quad"?"q":"")+
       (NAME_SRC[c.type]?(","+c.value):"");
  for(const w of wires){
    h=(h+w.x1*3+w.y1*5+w.x2*7+w.y2*11)|0;
    if(w.net)s+="|@"+w.x1+","+w.y1+","+w.net;
  }
  return s+"|"+h;
}
let _docCache=null,_docSig="";
function docNets(){
  const per=[];
  let sig=S.wireVer+"#"+S.page+"#"+S.pages.length;
  S.pages.forEach((p,i)=>{
    const comps=(i===S.page)?S.comps:(p.comps||[]);
    const wires=(i===S.page)?S.wires:(p.wires||[]);
    per.push({page:i,name:p.name,comps,wires});
    sig+="#"+pageSig(comps,wires);
  });
  if(_docCache&&_docSig===sig)return _docCache;
  const sheets=per.map(x=>({page:x.page,name:x.name,
    nets:(x.page===S.page)?nets():computeNets(x.comps,x.wires)}));
  const groups=[], byName=new Map();
  for(const sh of sheets){
    for(const n of sh.nets.list){
      const gk=n.global?n.name.toUpperCase():null;
      let g=gk?byName.get(gk):null;
      if(!g){
        g={name:n.name,global:!!gk,members:[],pages:[],nodes:[],conflict:false};
        if(gk)byName.set(gk,g);
        groups.push(g);
      }
      g.members.push({page:sh.page,net:n});
      if(!g.pages.includes(sh.page))g.pages.push(sh.page);
      g.conflict=g.conflict||n.conflict;
      for(const nd of n.nodes)g.nodes.push(Object.assign({page:sh.page},nd));
    }
  }
  groups.sort((a,b)=>(a.global!==b.global?(a.global?-1:1)
    :String(a.name).localeCompare(String(b.name),"fr",{numeric:true})));
  _docCache={sheets,groups};_docSig=sig;
  return _docCache;
}
function docGroupOf(net){
  if(!net||!net.global)return null;
  return docNets().groups.find(g=>g.global&&g.name.toUpperCase()===net.name.toUpperCase())||null;
}
function sheetList(pages){return pages.map(i=>"f"+(i+1)).join(", ");}
function netAt(x,y){return nets().byPoint.get(key(x,y))||null;}
/* Un point isolé forme un « net » d'un seul nœud : électriquement, ce n'est rien.
   netAtLive ne renvoie que les nets réellement établis. */
function isRealNet(n){return !!n&&(n.wires.length>0||n.nodes.length+n.powers.length>1);}
function netAtLive(x,y){const n=netAt(x,y);return isRealNet(n)?n:null;}
/* Renommer un net = poser un label unique sur son plus long segment.
   Les anciens labels du même net sont retirés pour éviter deux noms rivaux. */
function setNetName(net,name){
  if(!net||!net.wires.length)return false;
  const nm=String(name||"").trim().slice(0,32);
  if(net.src>=2 && nm){                 // nom déjà imposé par un symbole
    return false;
  }
  push();
  for(const w of net.wires) delete w.net;
  if(nm && !NET_AUTO.test(nm)){
    let best=net.wires[0];
    for(const w of net.wires) if(segLen(w)>segLen(best))best=w;
    best.net=nm;
  }
  touchWires();
  return true;
}
function selectNet(net){
  if(!net)return;
  clearSel();
  for(const w of net.wires)S.selW.add(w);
  // net sans fil (contact broche à broche) : on sélectionne les composants,
  // sinon le clic n'aurait aucun effet visible
  if(!net.wires.length) for(const nd of net.nodes)S.sel.add(nd.id);
  S.hoverNet=net;                 // halo immédiat, sans attendre un survol
  refreshPanels();draw();
}

/* =============================================================================
   editeur-schematique — 08-rendu-schema.js
   Rendu : jonctions, halo, étiquettes, symboles, boucle draw()
   ============================================================================= */
"use strict";
function drawJunctions(c){
  c.fillStyle=C_RED;
  for(const p of junctions()){c.beginPath();c.arc(p[0],p[1],5,0,Math.PI*2);c.fill();}
}
/* Halo sur le net survolé : on lit d'un coup d'œil jusqu'où va un fil. */
function drawNetGlow(c){
  const n=S.hoverNet;
  if(!n||!n.wires.length)return;
  if(nets().byWire.get(n.wires[0])!==n){S.hoverNet=null;return;} // net recalculé entre-temps
  c.save();
  c.strokeStyle=netColor(n);c.globalAlpha=.28;c.lineWidth=11;c.lineCap="round";
  c.beginPath();
  for(const w of n.wires){c.moveTo(w.x1,w.y1);c.lineTo(w.x2,w.y2);}
  c.stroke();
  c.globalAlpha=.85;
  for(const nd of n.nodes){c.beginPath();c.arc(nd.x,nd.y,4.5,0,Math.PI*2);
    c.fillStyle=netColor(n);c.fill();}
  c.restore();
}
/* Étiquettes de net posées sur les fils.
   S.netLabels : 0 = aucune · 1 = nets nommés seulement · 2 = tous */
function drawNetLabels(c,force){
  if(!S.netLabels)return;
  if(!force && S.scale<.45)return;
  const N=nets();
  c.save();
  c.lineWidth=1.2;
  for(const n of N.list){
    if(S.netLabels===1 && !n.named)continue;
    const a=n.anchor;
    if(!a)continue;
    const col=netColor(n);
    const t=(n.global?"⇄ ":"")+n.name+(n.conflict?" ⚠":"");
    const w=textW(t,10.5,true)+13, h=17;
    const x = a.vert ? a.x+12 : a.x-w/2;
    const y = a.vert ? a.y-h/2 : a.y-h-7;
    c.strokeStyle=n.conflict?C_RED:col;
    RR(c,x,y,w,h,4,"#16181c");
    TXT(c,t,x+w/2,y+h/2+.5,10.5,n.conflict?C_RED:col);
  }
  c.restore();
}
function drawComp(c,el,ghost){
  const def=defOf(el.type);
  c.save();
  if(ghost)c.globalAlpha=.45;
  c.translate(el.x,el.y);
  if(!def.flat){
    c.rotate(((el.rot%360)+360)%360*Math.PI/180);
    if(el.mir)c.scale(-1,1);
  }
  c.strokeStyle=C_COMP;c.lineWidth=3;c.lineCap="round";c.lineJoin="round";
  _symT=def.flat?null:{rot:el.rot|0,mir:!!el.mir};
  try{def.d(c,el);}finally{_symT=null;}
  c.restore();
  // pastilles de broches — dans un save/restore pour hériter de l'opacité du fantôme
  c.save();
  if(ghost)c.globalAlpha=.45;
  c.fillStyle="#8fd0ff";
  for(const p of allPins(el)){c.beginPath();c.arc(p.x,p.y,2.6,0,Math.PI*2);c.fill();}
  c.restore();
  // textes (jamais pivotés, pour rester lisibles)
  const rot=orient(el).rot;                  // normalisé : -90 ou 450 restent gérés
  const vert = rot===90||rot===270;
  const off = (typeof def.tOff==="function"?def.tOff(el):def.tOff)||34;
  c.save();if(ghost)c.globalAlpha=.45;
  if(def.refIn && el.ref) TXT(c,el.ref,el.x,el.y+1,12.5,C_TXT);
  if(def.valIn && el.value) TXT(c,el.value,el.x,el.y+1,12.5,C_TXT);
  // refIn / valIn : déjà tracé dans le symbole ci-dessus
  // valSelf       : le symbole imprime lui-même sa valeur (CI, étiquette de net…)
  // noRef / noVal : pas d'étiquette du tout
  const showRef = el.ref && !def.refIn && !def.noRef;
  let showVal = el.value && !def.valIn && !def.valSelf && !def.noVal;
  if(el.type==="vcc"){                       // la tension se lit au-dessus du rail
    if(showVal){
      const t=locToWorld(el,0,-30);
      TXT(c,el.value,t.x,t.y,13,C_TXT);
    }
    showVal=false;
  }
  // une seule étiquette de valeur, à un seul endroit : sous le symbole (ou à sa
  // droite s'il est pivoté), recentrée quand aucune référence ne l'accompagne
  if(vert){
    if(showRef) TXT(c,el.ref,el.x+off,el.y-9,12.5,C_TXT,"left");
    if(showVal) TXT(c,el.value,el.x+off,showRef?el.y+9:el.y,12,"#cfd4db","left");
  }else{
    if(showRef) TXT(c,el.ref,el.x,el.y-off,12.5,C_TXT);
    if(showVal) TXT(c,el.value,el.x,el.y+off,12,"#cfd4db");
  }
  c.restore();
}
function drawSel(c){
  // fils : halo sous le tracé + poignées carrées aux extrémités
  if(S.selW.size){
    c.save();
    c.strokeStyle=C_SEL;c.globalAlpha=.3;c.lineWidth=10;c.lineCap="round";
    c.beginPath();
    for(const w of S.wires){
      if(!S.selW.has(w))continue;
      c.moveTo(w.x1,w.y1);c.lineTo(w.x2,w.y2);
    }
    c.stroke();
    c.restore();
    const h=HANDLE/S.scale;                 // taille constante à l'écran
    c.fillStyle=C_SEL;
    for(const w of S.wires){
      if(!S.selW.has(w))continue;
      c.fillRect(w.x1-h,w.y1-h,h*2,h*2);
      c.fillRect(w.x2-h,w.y2-h,h*2,h*2);
    }
  }
  // composants : cadre pointillé
  c.strokeStyle=C_SEL;c.lineWidth=1.2;c.setLineDash([5,4]);
  for(const el of S.comps){
    if(!S.sel.has(el.id))continue;
    const b=bbox(el);
    c.strokeRect(b.x1,b.y1,b.x2-b.x1,b.y2-b.y1);
  }
  c.setLineDash([]);
}
/* Tracé en L entre deux points. horizFirst choisit le sens du coude ; routeL
   garde le choix historique (on part du plus grand déplacement). */
function routeAxis(a,b,horizFirst){
  const segs=[];
  if(a.x===b.x&&a.y===b.y)return segs;
  if(horizFirst){
    if(b.x!==a.x)segs.push({x1:a.x,y1:a.y,x2:b.x,y2:a.y});
    if(b.y!==a.y)segs.push({x1:b.x,y1:a.y,x2:b.x,y2:b.y});
  }else{
    if(b.y!==a.y)segs.push({x1:a.x,y1:a.y,x2:a.x,y2:b.y});
    if(b.x!==a.x)segs.push({x1:a.x,y1:b.y,x2:b.x,y2:b.y});
  }
  return segs;
}
function routeL(a,b){return routeAxis(a,b,Math.abs(b.x-a.x)>=Math.abs(b.y-a.y));}
function draw(){
  const dpr=window.devicePixelRatio||1, w=cv.width, h=cv.height;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=C_BG;ctx.fillRect(0,0,w,h);
  ctx.save();ctx.scale(dpr,dpr);
  drawGrid(ctx,w/dpr,h/dpr);
  ctx.restore();

  ctx.setTransform(dpr*S.scale,0,0,dpr*S.scale,dpr*S.ox,dpr*S.oy);
  drawNetGlow(ctx);
  drawWires(ctx);
  drawJunctions(ctx);
  for(const el of S.comps) drawComp(ctx,el,false);
  drawNetLabels(ctx);
  drawSel(ctx);

  // aperçu de pose
  if(S.place){
    drawComp(ctx,{id:-1,type:S.place,x:snap(S.mouse.x),y:snap(S.mouse.y),rot:S.placeRot||0,
                  mir:false,ref:"",value:defOf(S.place).v},true);
  }
  // aperçu de fil
  if(S.wireStart){
    const b={x:snap(S.mouse.x),y:snap(S.mouse.y)};
    ctx.strokeStyle=C_WIRE;ctx.globalAlpha=.75;ctx.lineWidth=3.4;ctx.setLineDash([7,5]);
    ctx.beginPath();
    for(const s of routeL(S.wireStart,b)){ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);}
    ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
    ctx.fillStyle=C_RED;ctx.beginPath();ctx.arc(S.wireStart.x,S.wireStart.y,4.5,0,Math.PI*2);ctx.fill();
  }
  // broche survolée
  if(S.hoverPin){
    ctx.strokeStyle=C_SEL;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(S.hoverPin.x,S.hoverPin.y,7,0,Math.PI*2);ctx.stroke();
  }
  // rectangle de sélection
  if(S.marquee){
    const m=S.marquee;
    ctx.strokeStyle=C_SEL;ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.strokeRect(Math.min(m.x1,m.x2),Math.min(m.y1,m.y2),Math.abs(m.x2-m.x1),Math.abs(m.y2-m.y1));
    ctx.setLineDash([]);
  }
  ctx.setTransform(1,0,0,1,0,0);
  document.getElementById("fZoom").textContent=Math.round(S.scale*100)+"%";
  document.getElementById("fN").textContent=S.comps.length;
  document.getElementById("fW").textContent=S.wires.length;
  document.getElementById("fNets").textContent=nets().list.length;
}

  return s2w(e.clientX-r.left, e.clientY-r.top);
}
function nearestPin(wx,wy,tol){
  let best=null,bd=tol*tol;
  for(const el of S.comps){
    allPins(el).forEach(p=>{
      const d=(p.x-wx)**2+(p.y-wy)**2;
      if(d<bd){bd=d;best={x:p.x,y:p.y,el};}
    });
  }
  return best;
}
function hitComp(wx,wy){
  for(let i=S.comps.length-1;i>=0;i--){
    const b=hitBox(S.comps[i]);
    if(wx>=b.x1&&wx<=b.x2&&wy>=b.y1&&wy<=b.y2)return S.comps[i];
  }
  return null;
}
function hitWire(wx,wy){
  const tol=6/S.scale;
  for(let i=S.wires.length-1;i>=0;i--){
    const w=S.wires[i];
    const dx=w.x2-w.x1, dy=w.y2-w.y1, len2=dx*dx+dy*dy||1;
    let t=((wx-w.x1)*dx+(wy-w.y1)*dy)/len2;t=Math.max(0,Math.min(1,t));
    const px=w.x1+t*dx, py=w.y1+t*dy;
    if((px-wx)**2+(py-wy)**2<tol*tol)return i;
  }
  return -1;
}

/* Pointer Events : une seule implémentation pour souris, stylet et tactile.
   La capture garantit que le glissement continue même hors du canvas. */
const PTR=new Map();
let pinch=null;

/* Points d'ancrage d'un déplacement : broches des composants concernés et
   extrémités des fils sélectionnés. Toute extrémité de fil posée sur l'un de
   ces points suit le mouvement, ce qui préserve le câblage — un fil voisin
   s'étire au lieu de se décrocher. */
function isProbe(el){return !!defOf(el.type).probe;}
function anchorKeys(els,wires){
  const a=new Set();
  // une sonde de mesure n'est pas électrique : la déplacer ne doit pas
  // arracher l'extrémité du fil qu'elle mesure
  for(const el of els){
    if(isProbe(el))continue;
    for(const q of allPins(el)) a.add(key(q.x,q.y));
  }
  for(const w of wires){a.add(key(w.x1,w.y1));a.add(key(w.x2,w.y2));}
  return a;
}
/* Réciproque : les sondes accrochées à un point qui bouge suivent le mouvement,
   sinon déplacer une résistance laisserait sa mesure orpheline à côté. Une sonde
   posée en plein milieu d'un fil suit ce fil s'il se déplace en entier. */
function probeFollowers(anchors,moving){
  if(!anchors)return [];
  const out=[];
  for(const el of S.comps){
    if(!isProbe(el)||(moving&&moving.has(el)))continue;
    const ps=allPins(el);
    if(!ps.length)continue;
    const p=ps[0];
    let hit=anchors.has(key(p.x,p.y));
    if(!hit)for(const w of S.wires){
      if(!anchors.has(key(w.x1,w.y1))||!anchors.has(key(w.x2,w.y2)))continue;
      if(insideSeg(p,w)){hit=true;break;}
    }
    if(hit)out.push({el,x0:el.x,y0:el.y});
  }
  return out;
}
function applyProbes(probes,dx,dy){
  for(const pr of probes){pr.el.x=pr.x0+dx;pr.el.y=pr.y0+dy;}
}
const PROBE_SNAP=3*G;              // portée d'accrochage d'une sonde, en px monde
function clamp(v,a,b){return Math.min(Math.max(v,Math.min(a,b)),Math.max(a,b));}
/* Point d'un fil le plus proche d'une position, recalé sur la grille sans
   quitter le segment : c'est ce qui permet de faire coulisser une sonde le
   long de son net au lieu de la décrocher. */
function nearestOnWires(x,y,wires){
  let best=null;
  for(const w of wires){
    const dx=w.x2-w.x1, dy=w.y2-w.y1, l2=dx*dx+dy*dy||1;
    let t=((x-w.x1)*dx+(y-w.y1)*dy)/l2;
    t=Math.max(0,Math.min(1,t));
    let px=w.x1+t*dx, py=w.y1+t*dy;
    if(dy===0){px=clamp(snap(px),w.x1,w.x2);py=w.y1;}          // fil horizontal
    else if(dx===0){py=clamp(snap(py),w.y1,w.y2);px=w.x1;}     // fil vertical
    const d=Math.hypot(px-x,py-y);
    if(!best||d<best.dist)best={x:px,y:py,dist:d,w};
  }
  return best;
}
// une sonde est « flat » : sa broche est un simple décalage local
function probePin(el){const p=pinsOf(el)[0]||[0,0];return {x:el.x+p[0],y:el.y+p[1]};}
function setProbePin(el,x,y){
  const p=pinsOf(el)[0]||[0,0];
  el.x=x-p[0];el.y=y-p[1];
}
/* Rallonge posée pendant le glissement : le fil s'étire depuis le point mesuré
   jusqu'à la sonde. Les segments sont de vrais fils, recréés à chaque mouvement
   parce qu'un coude peut apparaître ou disparaître. */
function clearStub(pr){
  if(!pr||!pr.stub)return;
  for(const w of pr.stub){const i=S.wires.indexOf(w);if(i>=0)S.wires.splice(i,1);}
  pr.stub=null;touchWires();
}
function setStub(pr,segs){
  clearStub(pr);
  if(!segs||!segs.length)return;
  pr.stub=segs;
  S.wires.push(...segs);
  touchWires();
}
/* Choisit le coude qui ne touche aucun autre net ; si les deux sont dangereux,
   aucune rallonge n'est posée — la sonde reste alors visiblement en l'air. */
function planStub(from,to,net){
  const h=Math.abs(to.x-from.x)>=Math.abs(to.y-from.y);
  for(const first of [h,!h]){
    const segs=routeAxis(from,to,first);
    if(segs.length&&stubClean(segs,net))return segs;
  }
  return null;
}
// point appartenant au segment, extrémités comprises
function pointOnSeg(p,w){
  const dx=w.x2-w.x1, dy=w.y2-w.y1;
  if((p.x-w.x1)*dy-(p.y-w.y1)*dx!==0)return false;
  const t=(p.x-w.x1)*dx+(p.y-w.y1)*dy;
  return t>=0 && t<=dx*dx+dy*dy;
}
/* Une rallonge ne doit jamais souder deux nets. Les croisements francs sont sans
   effet (pas de jonction sans extrémité commune) ; le danger vient des points de
   contact : extrémité d'un fil étranger posée sur la rallonge, extrémité de la
   rallonge tombant sur un fil étranger, ou broche traversée. */
function stubClean(segs,net){
  const own=new Set(net.wires), ownPts=new Set();
  for(const w of net.wires){ownPts.add(key(w.x1,w.y1));ownPts.add(key(w.x2,w.y2));}
  const foreign=[];
  for(const w of S.wires){
    if(own.has(w))continue;
    for(const e of [[w.x1,w.y1],[w.x2,w.y2]])
      if(!ownPts.has(key(e[0],e[1])))foreign.push({x:e[0],y:e[1]});
  }
  for(const el of S.comps){
    if(isProbe(el))continue;
    for(const q of allPins(el)) if(!ownPts.has(key(q.x,q.y)))foreign.push(q);
  }
  for(const sg of segs) for(const f of foreign) if(pointOnSeg(f,sg))return false;
  const tips=[];
  for(const sg of segs)tips.push({x:sg.x1,y:sg.y1},{x:sg.x2,y:sg.y2});
  for(const w of S.wires){
    if(own.has(w))continue;
    for(const t of tips) if(pointOnSeg(t,w))return false;
  }
  return true;
}
/* Glissement d'une sonde seule : elle reste accrochée à son net.
   · à portée d'un fil du net → elle coulisse dessus ;
   · au-delà → le net s'allonge d'une rallonge orthogonale jusqu'à elle ;
   · si elle était en l'air, elle s'accroche au premier fil rencontré. */
function probeDragMove(p){
  const d=S.drag, pr=d.probe, el=pr.el;
  const tx=pr.px0+(p.x-d.sx), ty=pr.py0+(p.y-d.sy);
  if((tx!==pr.px0||ty!==pr.py0)&&!d.moved){d.moved=true;d.before=serialize();}
  const pool=pr.net?pr.net.wires:S.wires;
  const near=pool.length?nearestOnWires(tx,ty,pool):null;
  if(near&&near.dist<=PROBE_SNAP){
    clearStub(pr);
    setProbePin(el,near.x,near.y);
  }else{
    setProbePin(el,snap(tx),snap(ty));
    // la rallonge part du point du net le plus proche, pas du point d'accroche
    // d'origine : sinon elle se superposerait aux fils déjà en place
    if(pr.net)setStub(pr,planStub(near||pr.from,probePin(el),pr.net));
  }
  if(pr.net)S.hoverNet=pr.net;         // halo : on voit le net auquel elle tient
}
function endsAt(anchors){
  const out=[];
  for(const w of S.wires){
    if(anchors.has(key(w.x1,w.y1)))out.push({w,e:1,x0:w.x1,y0:w.y1});
    if(anchors.has(key(w.x2,w.y2)))out.push({w,e:2,x0:w.x2,y0:w.y2});
  }
  return out;
}
function applyEnds(ends,dx,dy){
  for(const a of ends){
    if(a.e===1){a.w.x1=a.x0+dx;a.w.y1=a.y0+dy;}
    else{a.w.x2=a.x0+dx;a.w.y2=a.y0+dy;}
  }
  if(ends.length)touchWires();
}
function moveSelBy(dx,dy){
  const els=selEls(), wires=selWires();
  if(!els.length&&!wires.length)return;
  const anchors=anchorKeys(els,wires);
  const ends=endsAt(anchors);
  const probes=probeFollowers(anchors,new Set(els));
  for(const el of els){el.x+=dx;el.y+=dy;}
  applyProbes(probes,dx,dy);
  applyEnds(ends,dx,dy);
  draw();
}
/* Prépare un glissement.
   handle non nul = une seule extrémité de fil est saisie : le segment s'étire.
   detach     = les voisins raccordés restent en place au lieu de suivre. */
function beginDrag(p,handle,detach){
  const els=handle?[]:selEls();
  const wires=handle?[]:selWires();
  let ends, anchors=null;
  if(handle){
    const k=handle.e===1?key(handle.w.x1,handle.w.y1):key(handle.w.x2,handle.w.y2);
    if(detach){
      ends=[{w:handle.w,e:handle.e,
             x0:handle.e===1?handle.w.x1:handle.w.x2,
             y0:handle.e===1?handle.w.y1:handle.w.y2}];
    }else{
      anchors=new Set([k]);
      ends=endsAt(anchors);
    }
  }else if(detach){
    ends=[];
    for(const w of wires)ends.push({w,e:1,x0:w.x1,y0:w.y1},{w,e:2,x0:w.x2,y0:w.y2});
  }else{
    anchors=anchorKeys(els,wires);
    ends=endsAt(anchors);
  }
  S.drag={sx:p.x,sy:p.y,moved:false,before:null,handle:!!handle,
          items:els.map(c=>({el:c,x0:c.x,y0:c.y})),
          probes:probeFollowers(anchors,new Set(els)),   // vide si Ctrl+glisser
          probe:null,
          ends};
  // sonde seule, sans Ctrl : glissement accroché (coulisse ou étire le fil)
  if(!handle&&!detach&&!wires.length&&els.length===1&&isProbe(els[0])){
    const el=els[0], pin=probePin(el);
    S.drag.probe={el,px0:pin.x,py0:pin.y,from:{x:pin.x,y:pin.y},
                  net:netAtLive(pin.x,pin.y),stub:null};
  }
}
function finishDrag(){
  if(!S.drag)return;
  if(S.drag.moved){
    push(S.drag.before);                 // instantané pris au premier déplacement réel
    resolveSplits();                     // découpe seulement au dépôt, pas pendant le glissement
  }
  S.drag=null;refreshPanels();draw();
}
function finishMarquee(){
  if(!S.marquee)return;
  const m=S.marquee, x1=Math.min(m.x1,m.x2),x2=Math.max(m.x1,m.x2),
        y1=Math.min(m.y1,m.y2),y2=Math.max(m.y1,m.y2);
  if(Math.abs(x2-x1)>4||Math.abs(y2-y1)>4){
    for(const el of S.comps){
      const b=bbox(el);
      if(b.x1>=x1&&b.x2<=x2&&b.y1>=y1&&b.y2<=y2)S.sel.add(el.id);
    }
    for(const w of S.wires){                 // fils entièrement contenus
      if(Math.min(w.x1,w.x2)>=x1&&Math.max(w.x1,w.x2)<=x2&&
         Math.min(w.y1,w.y2)>=y1&&Math.max(w.y1,w.y2)<=y2)S.selW.add(w);
    }
  }
  S.marquee=null;refreshPanels();draw();
}

cv.addEventListener("pointerdown",e=>{
  PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(e.pointerType!=="mouse")e.preventDefault();

  // deux doigts : pincement pour zoomer et déplacer la vue
  if(PTR.size===2){
    finishDrag();finishMarquee();S.pan=null;
    const [a,b]=[...PTR.values()];
    pinch={d:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),
           mx:(a.x+b.x)/2,my:(a.y+b.y)/2,scale:S.scale,ox:S.ox,oy:S.oy};
    return;
  }
  if(PTR.size>2)return;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}

  const p=mpos(e);
  if(e.button===1||(e.button===0&&e.altKey)){
    S.pan={x:e.clientX,y:e.clientY,ox:S.ox,oy:S.oy};e.preventDefault();return;
  }
  if(e.button===2)return;

  // pose de composant
  if(S.place){
    push();
    const el=addComp(S.place,p.x,p.y);
    el.rot=S.placeRot||0;
    if(!e.shiftKey){S.place=null;setPalette(null);}
    clearSel();S.sel.add(el.id);
    refreshPanels();draw();return;
  }
  if(S.mode==="wire"){
    const pin=nearestPin(p.x,p.y,(e.pointerType==="mouse"?12:20)/S.scale);
    const pt=pin?{x:pin.x,y:pin.y}:{x:snap(p.x),y:snap(p.y)};
    if(!S.wireStart){S.wireStart=pt;}
    else{
      const segs=routeL(S.wireStart,pt);
      if(segs.length){push();S.wires.push(...segs);touchWires();resolveSplits();}
      S.wireStart=pin?null:pt;   // arrivée sur une broche = fin de fil
    }
    refreshPanels();draw();return;
  }
  if(S.mode==="erase"){
    const el=hitComp(p.x,p.y);
    if(el){push();deleteComps([el.id]);refreshPanels();draw();return;}
    const wi=hitWire(p.x,p.y);
    if(wi>=0){push();S.selW.delete(S.wires[wi]);S.wires.splice(wi,1);touchWires();refreshPanels();draw();}
    return;
  }
  // sélection : composant d'abord, puis fil
  const el=hitComp(p.x,p.y);
  if(el){
    if(e.shiftKey){S.sel.has(el.id)?S.sel.delete(el.id):S.sel.add(el.id);}
    else if(!S.sel.has(el.id)){clearSel();S.sel.add(el.id);}
    beginDrag(p,null,e.ctrlKey||e.metaKey);
    refreshPanels();draw();return;
  }
  const wi=hitWire(p.x,p.y);
  if(wi>=0){
    const w=S.wires[wi];
    if(e.shiftKey){S.selW.has(w)?S.selW.delete(w):S.selW.add(w);}
    else if(!S.selW.has(w)){clearSel();S.selW.add(w);}
    // extrémité saisie : on étire le segment au lieu de le translater
    let handle=null;
    if(!e.shiftKey&&S.selW.has(w)){
      const tol=(e.pointerType==="mouse"?9:18)/S.scale;
      if(Math.hypot(p.x-w.x1,p.y-w.y1)<=tol)handle={w,e:1};
      else if(Math.hypot(p.x-w.x2,p.y-w.y2)<=tol)handle={w,e:2};
    }
    beginDrag(p,handle,e.ctrlKey||e.metaKey);
    refreshPanels();draw();return;
  }
  if(e.pointerType!=="mouse"){
    // au doigt, glisser sur le vide déplace la vue : plus naturel qu'un lasso
    S.pan={x:e.clientX,y:e.clientY,ox:S.ox,oy:S.oy};
    if(!e.shiftKey)clearSel();
  }else{
    if(!e.shiftKey)clearSel();
    S.marquee={x1:p.x,y1:p.y,x2:p.x,y2:p.y};
  }
  refreshPanels();draw();
});

cv.addEventListener("pointermove",e=>{
  if(PTR.has(e.pointerId))PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(pinch&&PTR.size>=2){
    const [a,b]=[...PTR.values()];
    const d=Math.max(1,Math.hypot(a.x-b.x,a.y-b.y));
    const r=cv.getBoundingClientRect();
    const k=Math.max(.25,Math.min(4,pinch.scale*d/pinch.d))/pinch.scale;
    const mx=pinch.mx-r.left, my=pinch.my-r.top;
    S.scale=pinch.scale*k;
    S.ox=mx-(mx-pinch.ox)*k+((a.x+b.x)/2-pinch.mx);
    S.oy=my-(my-pinch.oy)*k+((a.y+b.y)/2-pinch.my);
    draw();return;
  }

  const p=mpos(e);S.mouse=p;
  document.getElementById("fX").textContent=Math.round(p.x/G);
  document.getElementById("fY").textContent=Math.round(p.y/G);
  if(S.pan){
    S.ox=S.pan.ox+(e.clientX-S.pan.x);S.oy=S.pan.oy+(e.clientY-S.pan.y);draw();return;
  }
  if(S.drag){
    const dx=snap(p.x-S.drag.sx), dy=snap(p.y-S.drag.sy);
    if((dx||dy)&&!S.drag.moved){
      S.drag.moved=true;
      S.drag.before=serialize();   // l'état est encore intact à cet instant
    }
    if(S.drag.probe){probeDragMove(p);draw();return;}
    for(const it of S.drag.items){it.el.x=it.x0+dx;it.el.y=it.y0+dy;}
    applyProbes(S.drag.probes,dx,dy);
    applyEnds(S.drag.ends,dx,dy);  // aucune copie profonde : les extrémités
    draw();return;                 // concernées sont repérées une fois au départ
  }
  if(S.marquee){S.marquee.x2=p.x;S.marquee.y2=p.y;draw();return;}
  // net survolé : halo sur tout le net et rappel dans la barre d'état
  const wi=hitWire(p.x,p.y);
  let hn=null;
  if(wi>=0)hn=nets().byWire.get(S.wires[wi])||null;
  else{
    const pin=nearestPin(p.x,p.y,10/S.scale);
    if(pin)hn=netAt(pin.x,pin.y);
  }
  const hoverChanged=(hn!==S.hoverNet);
  if(hoverChanged){
    S.hoverNet=hn;
    document.getElementById("fNet").textContent = hn
      ? hn.name+" · "+hn.nodes.length+(hn.nodes.length>1?" nœuds":" nœud")
      : "—";
  }
  if(S.mode==="select"){
    // indice de survol : le curseur annonce ce qui est saisissable
    cv.style.cursor=(hitComp(p.x,p.y)||wi>=0)?"move":"crosshair";
  }
  S.hoverPin = (S.mode==="wire")?nearestPin(p.x,p.y,12/S.scale):null;
  if(S.mode==="wire"||S.place||hoverChanged)draw();
});

function endPointer(e){
  PTR.delete(e.pointerId);
  if(pinch&&PTR.size<2)pinch=null;
  if(PTR.size>0)return;
  if(S.pan){S.pan=null;return;}
  finishDrag();
  finishMarquee();
}
window.addEventListener("pointerup",endPointer);
window.addEventListener("pointercancel",endPointer);

cv.addEventListener("contextmenu",e=>{
  e.preventDefault();
  if(S.wireStart){S.wireStart=null;draw();}
  else if(S.place){S.place=null;setPalette(null);draw();}
});
cv.addEventListener("dblclick",()=>{if(S.wireStart){S.wireStart=null;draw();}});
cv.addEventListener("auxclick",e=>{if(e.button===1)e.preventDefault();});
cv.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const before=s2w(mx,my);
  const f=e.deltaY<0?1.12:1/1.12;
  S.scale=Math.max(.25,Math.min(4,S.scale*f));
  const after=s2w(mx,my);
  S.ox+=(after.x-before.x)*S.scale;S.oy+=(after.y-before.y)*S.scale;
  draw();
},{passive:false});

/* ---------- js/10-actions.js ---------- */
/* =============================================================================
   editeur-schematique — 10-actions.js
   Actions : pivoter, miroir, dupliquer, supprimer, recadrer, mode
   ============================================================================= */
"use strict";
/* ==========================================================================
   Actions
   ========================================================================== */
function deleteComps(ids){
  const set=new Set(ids);
  S.comps=S.comps.filter(c=>!set.has(c.id));
  ids.forEach(i=>S.sel.delete(i));
}
/* Transforme la sélection en emmenant les extrémités de fils accrochées aux
   broches : sans cela, une rotation détache visuellement tous les câblages. */
function transformSel(fn){
  const els=selEls();if(!els.length)return;
  push();
  const moves=[];
  for(const el of els){
    const before=allPins(el);
    fn(el);
    const after=allPins(el);
    before.forEach((p,i)=>{
      const q=after[i];
      if(q&&(p.x!==q.x||p.y!==q.y))moves.push([p,q]);
    });
  }
  const done=new Set();
  for(const [a,b] of moves){
    for(let i=0;i<S.wires.length;i++){
      const w=S.wires[i];
      if(!done.has(i+":1")&&w.x1===a.x&&w.y1===a.y){w.x1=b.x;w.y1=b.y;done.add(i+":1");}
      if(!done.has(i+":2")&&w.x2===a.x&&w.y2===a.y){w.x2=b.x;w.y2=b.y;done.add(i+":2");}
    }
  }
  // les sondes posées sur une broche déplacée par la rotation suivent aussi
  const moved=new Set(els), shifted=new Set();
  for(const [a,b] of moves){
    for(const el of S.comps){
      if(!isProbe(el)||moved.has(el)||shifted.has(el))continue;
      const p=allPins(el)[0];
      if(p&&p.x===a.x&&p.y===a.y){el.x+=b.x-a.x;el.y+=b.y-a.y;shifted.add(el);}
    }
  }
  touchWires();refreshPanels();draw();
}
function rotateSel(){transformSel(el=>{el.rot=((((el.rot|0)+90)%360)+360)%360;});}
function mirrorSel(){transformSel(el=>{el.mir=!el.mir;});}
function dupSel(){
  const els=selEls(), wires=selWires();
  if(!els.length&&!wires.length)return;
  push();
  const copies=wires.map(w=>{
    const c={x1:w.x1+40,y1:w.y1+40,x2:w.x2+40,y2:w.y2+40};
    if(w.net)c.net=w.net;          // même nom = même net, la copie reste raccordée
    return c;
  });
  clearSel();
  for(const e of els){
    const n=JSON.parse(JSON.stringify(e));
    n.id=S.uid++;n.x+=40;n.y+=40;
    if(!defOf(n.type).noRef)n.ref=nextRef(defOf(n.type).p);
    S.comps.push(n);S.sel.add(n.id);
  }
  for(const w of copies){S.wires.push(w);S.selW.add(w);}
  if(copies.length)touchWires();
  refreshPanels();draw();
}
function delSel(){
  const wires=selWires();
  if(!S.sel.size&&!wires.length)return;
  push();
  if(S.sel.size)deleteComps([...S.sel]);
  if(wires.length){
    // suppression en place : la feuille garde la même référence de tableau
    for(let i=S.wires.length-1;i>=0;i--) if(S.selW.has(S.wires[i])) S.wires.splice(i,1);
    S.selW.clear();touchWires();
  }
  refreshPanels();draw();
}
function fit(){
  if(!S.comps.length&&!S.wires.length){S.scale=1;S.ox=cv.clientWidth/2;S.oy=cv.clientHeight/2;draw();return;}
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  for(const el of S.comps){const b=bbox(el);x1=Math.min(x1,b.x1);y1=Math.min(y1,b.y1);x2=Math.max(x2,b.x2);y2=Math.max(y2,b.y2);}
  for(const w of S.wires){x1=Math.min(x1,w.x1,w.x2);y1=Math.min(y1,w.y1,w.y2);x2=Math.max(x2,w.x1,w.x2);y2=Math.max(y2,w.y1,w.y2);}
  const pad=60, W=cv.clientWidth, H=cv.clientHeight;
  S.scale=Math.max(.25,Math.min(2.5,Math.min(W/(x2-x1+pad*2),H/(y2-y1+pad*2))));
  S.ox=W/2-(x1+x2)/2*S.scale;S.oy=H/2-(y1+y2)/2*S.scale;
  draw();
}
// une seule porte d'entrée pour la grille : bouton et touche G restent d'accord,
// et le bouton s'allume quand la grille est visible (et non l'inverse)
function setGrid(v){
  S.showGrid=!!v;
  document.getElementById("bGrid").classList.toggle("on",S.showGrid);
  draw();
}
function setMode(m){
  S.mode=m;S.wireStart=null;S.hoverPin=null;
  if(m!=="select"){S.place=null;setPalette(null);}
  for(const [id,md] of [["mSelect","select"],["mWire","wire"],["mErase","erase"]])
    document.getElementById(id).classList.toggle("on",S.mode===md);
  document.getElementById("fMode").textContent={select:"Sélection",wire:"Fil",erase:"Gomme"}[m];
  cv.style.cursor = m==="erase"?"not-allowed":"crosshair";
  document.getElementById("fHint").textContent = {
    select:"Glisser pour déplacer · une sonde coulisse le long de son net, plus loin le fil s'étire · Ctrl+glisser pour détacher.",
    wire:"Clic pour démarrer, clic pour poser un coude, clic sur une broche pour terminer · Clic droit ou Échap annule.",
    erase:"Clic sur un composant ou un fil pour le supprimer."
  }[m];
  draw();
}

   Palette de composants (icônes + construction)
   ============================================================================= */
"use strict";

function iconFor(type){
  const cvs=document.createElement("canvas");
  const w=62,h=44,dpr=window.devicePixelRatio||1;
  cvs.width=w*dpr;cvs.height=h*dpr;cvs.style.width=w+"px";cvs.style.height=h+"px";
  const c=cvs.getContext("2d");
  c.scale(dpr,dpr);c.translate(w/2,h/2);
  const def=defOf(type);
  const sample={value:def.icon||def.v,npins:6};
  let m=34;pinsOf({type:type,npins:6}).forEach(p=>{m=Math.max(m,Math.abs(p[0]),Math.abs(p[1]));});
  const e=typeof def.ext==="function"?def.ext(sample):def.ext;
  if(e)e.forEach(v=>{m=Math.max(m,Math.abs(v));});
  const s=Math.min(w,h)/(m*2+16);
  c.scale(s,s);
  c.strokeStyle=C_COMP;c.lineWidth=3;c.lineCap="round";c.lineJoin="round";
  def.d(c,sample);
  return cvs;
}
function setPalette(type){
  document.querySelectorAll(".item").forEach(n=>n.classList.toggle("on",n.dataset.type===type));
}
function buildPalette(){
  const box=document.getElementById("palette");
  for(const cat of CATS){
    const h=document.createElement("div");h.className="cat";h.textContent=cat;box.appendChild(h);
    const g=document.createElement("div");g.className="grid";
    for(const [type,def] of Object.entries(LIB)){
      if(def.cat!==cat)continue;
      const b=document.createElement("div");b.className="item";b.dataset.type=type;b.title=def.n;
      b.appendChild(iconFor(type));
      const s=document.createElement("span");s.textContent=def.n;b.appendChild(s);
      b.onclick=()=>{
        setMode("select");
        S.place = S.place===type?null:type;S.placeRot=0;
        setPalette(S.place);
        document.getElementById("fHint").textContent = S.place
          ? "Clic sur la feuille pour poser "+def.n+" · R pour pivoter · Maj+clic pour en poser plusieurs."
          : "Clic sur un composant de la bibliothèque puis clic sur la feuille pour le poser.";
        draw();
      };
      g.appendChild(b);
    }
    box.appendChild(g);
  }
}
