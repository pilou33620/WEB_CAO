[package]
name = "outils"
version = "0.1.0"
edition = "2021"
description = "Outils de construction de WEB_CAO (manuel, monofichiers, fonte des plans), passerelle MCP et petits bancs"

[lib]
doctest = false

[dependencies]
regex = "1" # le Markdown du manuel et les balises des monofichiers
serde_json = { version = "1", features = ["preserve_order"] } # les dict de Python gardent l'ordre d'insertion
# La passerelle MCP : urllib + ssl de Python. native-certs lit le magasin de certificats du système.
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }
