<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard CAO Web</title>
<style>
  :root {
    --bg: #0f1012;
    --panel: #17181b;
    --border: #2b2e34;
    --border2: #3a3e46;
    --txt: #e6e8ec;
    --txt-dim: #8b919c;
    --blue: #3fa0ea;
    --blue-deep: #2b7fbf;
    --ui: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--txt); font-family: var(--ui);
    display: flex; align-items: center; justify-content: center;
    height: 100vh; margin: 0;
  }
  .container {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 40px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  h1 { margin: 0 0 10px; font-size: 20px; letter-spacing: 0.1em; font-weight: 600; text-transform: uppercase; }
  p { color: var(--txt-dim); margin-bottom: 30px; font-size: 14px; }
  .actions { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-block;
    background: var(--panel);
    color: var(--blue);
    border: 1px solid var(--border2);
    padding: 12px 24px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
  }
  a.btn:hover {
    border-color: var(--blue);
    background: var(--blue-deep);
    color: #fff;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>CAO Web</h1>
    <p>Sélectionnez l'éditeur pour commencer :</p>
    <div class="actions">
      <a href="editeur-schematique/editeur-schematique.html" class="btn">Éditeur Schématique</a>
      <a href="editeur-pcb/editeur-pcb.html" class="btn">Éditeur PCB</a>
    </div>
  </div>
</body>
</html>
