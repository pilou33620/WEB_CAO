<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recherche de composants — Dashboard nocturne</title>
<link rel="stylesheet" href="css/recherche.css">
<link rel="stylesheet" href="../commun/workspace.css">
<link rel="stylesheet" href="../commun/session.css">
<link rel="stylesheet" href="../commun/profils.css">
</head>
<body>

<header>
  <div class="brand"><i></i><b>Recherche de composants</b><span>V1.0 · PCBPARTS.DEV</span></div>
  <div class="tools">
    <button class="tb" data-cao-nav="accueil" title="Page d'accueil">⌂ Accueil</button>
    <button class="tb" data-cao-nav="schema" title="Revenir au schéma — il est resté dans l'onglet">Éditeur schématique</button>
    <button class="tb" data-cao-nav="pcb" title="Revenir au routage — la carte est restée dans l'onglet">Éditeur PCB</button>
    <button class="tb" id="bProfil" data-cao-profil title="Utilisateur : panneaux, réglages et derniers documents lui appartiennent">👤 …</button>
    <div class="sep"></div>
    <button class="tb on" id="bRun">Rechercher <kbd>Entrée</kbd></button>
    <button class="tb" id="bReset">Réinitialiser</button>
    <button class="tb" id="bBack" title="Revenir au résultat précédent">↶ Précédent</button>
    <div class="sep"></div>
    <button class="tb" id="bCsv">Exporter .csv</button>
    <button class="tb" id="bJson">Exporter .json</button>
    <div class="sep"></div>
    <button class="tb" id="bApi" title="Adresse du serveur de recherche">Serveur…</button>
    <button class="tb" id="bWs">Espace de travail ▾</button>
  </div>
</header>

<main id="ws">
  <div class="dock" id="dockL"></div>
  <div class="gut gv" data-dock="dockL"></div>

  <div class="ctr" id="ctr">
    <div id="canvasWrap">
      <div id="vue">
        <section id="form">
          <div class="form-head">
            <h2 id="formTitre">Recherche JLCPCB</h2>
            <p id="formResume">Chargement des outils…</p>
          </div>
          <div id="formChamps"></div>
          <div class="form-actions">
            <button class="tb on" id="bRun2">Rechercher</button>
            <button class="tb" id="bReset2">Réinitialiser</button>
            <span id="formErr" class="err"></span>
          </div>
        </section>
        <section id="resultats" class="scroll"></section>
      </div>
    </div>
    <div class="gut gh" data-dock="dockB"></div>
    <div class="dock" id="dockB"></div>
  </div>

  <div class="gut gv" data-dock="dockR"></div>
  <div class="dock" id="dockR"></div>
</main>

<div id="pnlStore" hidden>
  <section class="pnl" data-pnl="outils" data-title="Outils">
    <header class="pnl-head">
      <span class="pnl-grip">⠿</span><span class="pnl-title">Outils</span>
      <span class="pnl-acts">
        <button class="pnl-btn" data-act="collapse" title="Replier">▾</button>
        <button class="pnl-btn" data-act="maximize" title="Plein écran">□</button>
        <button class="pnl-btn" data-act="float" title="Détacher / rattacher">⬒</button>
        <button class="pnl-btn" data-act="close" title="Fermer">✕</button>
      </span>
    </header>
    <div class="pnl-body">
      <div class="pnl-bar">
        <input type="search" id="filtreOutils" placeholder="filtrer…" autocomplete="off">
      </div>
      <div class="scroll" id="listeOutils"></div>
    </div>
  </section>

  <section class="pnl" data-pnl="details" data-title="Détail">
    <header class="pnl-head">
      <span class="pnl-grip">⠿</span><span class="pnl-title">Détail</span>
      <span class="pnl-acts">
        <button class="pnl-btn" data-act="collapse" title="Replier">▾</button>
        <button class="pnl-btn" data-act="maximize" title="Plein écran">□</button>
        <button class="pnl-btn" data-act="float" title="Détacher / rattacher">⬒</button>
        <button class="pnl-btn" data-act="close" title="Fermer">✕</button>
      </span>
    </header>
    <div class="pnl-body"><div class="scroll" id="details"></div></div>
  </section>

  <section class="pnl" data-pnl="brut" data-title="Réponse brute">
    <header class="pnl-head">
      <span class="pnl-grip">⠿</span><span class="pnl-title">Réponse brute</span>
      <span class="pnl-acts">
        <button class="pnl-btn" data-act="collapse" title="Replier">▾</button>
        <button class="pnl-btn" data-act="maximize" title="Plein écran">□</button>
        <button class="pnl-btn" data-act="float" title="Détacher / rattacher">⬒</button>
        <button class="pnl-btn" data-act="close" title="Fermer">✕</button>
      </span>
    </header>
    <div class="pnl-body">
      <div class="pnl-bar">
        <span class="pnl-lbl">JSON renvoyé par pcbparts.dev</span>
        <button class="tb mini" id="bCopyJson" style="margin-left:auto">Copier</button>
      </div>
      <div class="scroll" id="brut"></div>
    </div>
  </section>
</div>

<div id="floatLayer"></div>
<div id="dropZone"></div>
<div id="dragGhost"></div>

<footer>
  <span>Outil <b id="fTool">—</b></span>
  <span>Résultats <b id="fCount">0</b></span>
  <span id="fHint" class="hint">Démarrage…</span>
  <span class="push" id="fApi">serveur : —</span>
</footer>

<script src="../commun/session.js"></script>
<script src="../commun/profils.js"></script>
<script src="js/00-espace-config.js"></script>
<script src="js/01-api.js"></script>
<script src="js/02-outils.js"></script>
<script src="js/03-formulaire.js"></script>
<script src="js/04-resultats.js"></script>
<script src="js/05-details.js"></script>
<script src="js/06-demarrage.js"></script>
<script src="../commun/workspace.js"></script>
</body>
</html>
