name: bancs d'essai

on:
  push:
  pull_request:

jobs:
  essais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vérification syntaxique des scripts Python
        run: |
          python -m compileall -q web_CAO.py python commun/outils \
            editeur-pcb/outils editeur-schematique/outils

      # ====================================================================
      # LES SOLVEURS
      # --------------------------------------------------------------------
      # Les solveurs d'impédance 2D MoM, de diaphonie, d'IR drop, les routes
      # du serveur et les sécurités sont systématiquement éprouvés ici.
      #
      # LES DÉPENDANCES SONT INSTALLÉES ICI ET NULLE PART AILLEURS : c'est ce
      # qui permet à requirements.txt de rester vide, donc au double-clic sur
      # web_CAO.py de marcher sans réseau. Voir son en-tête.
      - name: Solveurs — dépendances de calcul
        run: pip install --quiet numpy scipy

      - name: Solveur de section (MoM 2D) — banc d'essai
        run: python python/test/banc-ligne-mom.py

      - name: Crosstalk (MTL en cascade) — banc d'essai
        run: python python/test/banc-crosstalk.py

      - name: Chute de tension continue (IR drop) — banc d'essai
        run: python python/test/banc-dc.py

      - name: Scoring de placement PCB — banc d'essai
        run: python python/test/banc-pcb-scoring.py

      - name: Reconnaissance de motifs schématiques — banc d'essai
        run: python python/test/banc-patterns.py

      - name: Routes du serveur et sécurités — banc d'essai
        run: python python/test/banc-serveur-routes.py

      - name: Routes de gestion de bibliothèque — banc d'essai
        run: python python/test/banc-lib-routes.py

      - name: Gestion LIB — catalogue et import JLCPCB
        run: |
          node gestion-lib/test/banc-catalogue.js
          node gestion-lib/test/banc-import-jlc.js

      - name: Mise à jour automatique GitHub — banc d'essai
        run: python python/test/banc-maj-github.py

      - name: Visionneuse IPC-2581 — banc d'essai du parseur
        run: |
          # La moitié d'outil qui ne tourne pas dans le navigateur. Il porte sa
          # propre carte d'essai : rien à télécharger, rien de lourd versionné.
          python visionneuse-ipc2581/test/banc-essai.py

      - name: Visionneuse IPC-2581 — banc de la mesure de masse
        run: |
          # Pur JavaScript sur Node : ce banc lit les sources telles quelles,
          # sans assemblage ni dépendance. Il éprouve la GÉOMÉTRIE lue sur le
          # modèle -- où est le cuivre de masse, de quel côté, sur quelle
          # longueur --, là où banc-essai.py juste au-dessus éprouve le
          # parseur. Rien ne l'empêchait de tourner ici ; il n'y était pas.
          node visionneuse-ipc2581/test/harness-sim.js

      # LE MONOFICHIER N'EST PAS VERSIONNÉ (.gitignore : « dist/ »), et il n'y a
      # donc rien à y vérifier de fraîcheur : chaque exécution le reconstruit
      # depuis les sources, ci-dessous. C'est le bon choix — un artefact de
      # deux mégaoctets dans l'historique n'apporte rien —, mais il a une
      # conséquence à connaître : un dist/ resté sur un poste peut avoir des
      # semaines de retard sur js/ sans que rien ne le signale, et c'est ce
      # fichier-là qu'on ouvre en double-clic. Après avoir touché à js/,
      # relancer build-monofichier.py fait partie du geste.
      - name: Éditeur PCB — assemblage puis banc d'essai
        run: |
          python editeur-pcb/outils/build-monofichier.py
          node --check editeur-pcb/dist/pcb.js
          node editeur-pcb/test/harness.js

      - name: Éditeur schématique — assemblage puis banc d'essai
        run: |
          python editeur-schematique/outils/build-monofichier.py
          node --check editeur-schematique/dist/schema.js
          node editeur-schematique/test/harness.js

      - name: Le monofichier doit être reproductible
        run: |
          # deux assemblages d'affilée donnent le même résultat : rien
          # d'horodaté ni d'aléatoire ne se glisse dans la sortie
          cp editeur-pcb/dist/pcb.js /tmp/pcb-1.js
          cp editeur-schematique/dist/schema.js /tmp/schema-1.js
          python editeur-pcb/outils/build-monofichier.py
          python editeur-schematique/outils/build-monofichier.py
          diff -q /tmp/pcb-1.js editeur-pcb/dist/pcb.js
          diff -q /tmp/schema-1.js editeur-schematique/dist/schema.js
