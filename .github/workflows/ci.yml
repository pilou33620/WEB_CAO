name: bancs d'essai

on:
  push:
  pull_request:

# le flux ne fait que lire le dépôt : le jeton n'a pas d'autre droit
permissions:
  contents: read

jobs:
  essais:
    runs-on: ubuntu-latest
    # « bash » nommé : -o pipefail, sans quoi « banc | tee » cacherait l'échec du banc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0, épinglée : une étiquette se déplace

      # La LIB ne vit plus dans ce depot : c'est celle de WEB_SUITE, dans le
      # depot WEB_SUITE_PROJETS. Clonee a cote, la ou WEB_SUITE la range
      # (../PROJETS/LIB_CAO) : web_CAO.py et les bancs l'y trouvent seuls.
      #
      # WEB_SUITE_PROJETS EST PRIVE. Sans token, la vraie LIB n'est pas
      # disponible ici : les bancs qui eprouvent son CONTENU (banc-lib-routes,
      # banc-rf, catalogue) sont sautes avec un avertissement, et les autres
      # (routes et securites du serveur) tournent sur une LIB factice minimale
      # (WEB_CAO_LIB_MINIMALE, voir python/test/lib_essai.py). Ces trois bancs
      # restent a lancer sur un poste qui a la LIB.
      #
      # Avec un secret PROJETS_TOKEN (token en lecture seule sur
      # WEB_SUITE_PROJETS), la LIB est clonee et tout tourne : le jeton est
      # masque dans le journal et retire de l'adresse du clone.
      - name: LIB — dépôt WEB_SUITE_PROJETS (privé)
        env:
          JETON: ${{ secrets.PROJETS_TOKEN }}
        run: |
          if [ -z "$JETON" ]; then
            echo "::warning title=LIB privée non testée::WEB_SUITE_PROJETS est privé : banc-lib-routes, banc-rf et le catalogue de la Gestion LIB sont sautés. Les routes et sécurités du serveur tournent sur une LIB factice."
            echo "WEB_CAO_LIB_MINIMALE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${JETON}@github.com/pilou33620/WEB_SUITE_PROJETS.git" ../PROJETS
          git -C ../PROJETS remote set-url origin https://github.com/pilou33620/WEB_SUITE_PROJETS.git
          echo "LIB_REELLE=1" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.12'

      - name: Vérification syntaxique des scripts Python
        run: |
          python -m compileall -q web_CAO.py python commun/outils \
            editeur-pcb/outils editeur-schematique/outils

      # ====================================================================
      # LES SOLVEURS
      # --------------------------------------------------------------------
      # Les solveurs d'impédance 2D MoM, de diaphonie, d'IR drop, les routes
      # du serveur et les sécurités sont systématiquement éprouvés ici.
      #
      # numpy et scipy sont ceux de requirements.txt : web_CAO.py ne démarre
      # pas sans eux.
      - name: Solveurs — dépendances de calcul
        run: pip install --quiet -r requirements.txt

      - name: Solveur de section (MoM 2D) — banc d'essai
        run: python python/test/banc-ligne-mom.py

      - name: Crosstalk (MTL en cascade) — banc d'essai
        run: python python/test/banc-crosstalk.py

      - name: Banc de mesure crosstalk — prévisions WEB_CAO
        run: python bancs-mesure/crosstalk/banc-crosstalk-mesure.py

      - name: Simulation RF (S21 port à port) — banc d'essai
        run: |
          if [ "$LIB_REELLE" = 1 ]; then python python/test/banc-rf.py
          else echo "::warning title=Banc sauté::banc-rf.py : la LIB privée n'est pas disponible ici (voir l'étape LIB)."; fi

      - name: Diagramme de l'œil (PRBS, pire cas, gabarits) — banc d'essai
        run: python python/test/banc-oeil.py

      - name: Chute de tension continue (IR drop) — banc d'essai
        run: python python/test/banc-dc.py

      - name: Scoring de placement PCB — banc d'essai
        run: python python/test/banc-pcb-scoring.py

      - name: Reconnaissance de motifs schématiques — banc d'essai
        run: python python/test/banc-patterns.py

      - name: Entrées malformées des solveurs — banc d'essai
        run: python python/test/banc-entrees-malformees.py

      - name: Vérification de la carte — banc d'essai
        run: python python/test/banc-analyse-carte.py

      - name: Routes du serveur et sécurités — banc d'essai
        run: python python/test/banc-serveur-routes.py

      - name: Routes de gestion de bibliothèque — banc d'essai
        run: |
          if [ "$LIB_REELLE" = 1 ]; then python python/test/banc-lib-routes.py
          else echo "::warning title=Banc sauté::banc-lib-routes.py : la LIB privée n'est pas disponible ici (voir l'étape LIB)."; fi

      - name: Enregistrer + GitHub (relai au lanceur WEB_SUITE) — banc d'essai
        run: python python/test/banc-github-relai.py

      - name: Projets en écoute réseau (--projets-reseau) — banc d'essai
        run: python python/test/banc-projets-reseau.py

      - name: Gestion LIB — catalogue et import JLCPCB
        run: |
          if [ "$LIB_REELLE" = 1 ]; then node gestion-lib/test/banc-catalogue.js
          else echo "::warning title=Banc sauté::banc-catalogue.js : la LIB privée n'est pas disponible ici (voir l'étape LIB)."; fi
          node gestion-lib/test/banc-import-jlc.js
          node gestion-lib/test/banc-composants.js
          node recherche-composants/test/banc-export-csv.js

      - name: Gestion LIB — repère des empreintes (y vers le bas, comme l'éditeur PCB)
        run: node gestion-lib/test/banc-repere-pcb.js

      - name: Modèles 3D de la LIB — placement sur l'empreinte
        run: node python/test/banc-maillages-3d.mjs

      - name: Rapport de simulation (Markdown) — banc d'essai
        run: node commun/test/banc-rapport-sim.js

      - name: Canal de pilotage (MCP de web_suite) — commandes des pages
        run: node commun/test/banc-pilote-cao.js

      - name: Menus déroulants — restent dans l'écran
        run: |
          node commun/test/banc-menus.js
          node commun/test/banc-tactile-tuto.js
          node commun/test/banc-racine.js

      - name: Mise à jour automatique GitHub — banc d'essai
        run: python python/test/banc-maj-github.py

      - name: Visionneuse IPC-2581 — banc d'essai du parseur
        run: |
          # La moitié d'outil qui ne tourne pas dans le navigateur. Il porte sa
          # propre carte d'essai : rien à télécharger, rien de lourd versionné.
          python visionneuse-ipc2581/test/banc-essai.py

      # LE MONOFICHIER N'EST PAS VERSIONNÉ (.gitignore : « dist/ »), et il n'y a
      # donc rien à y vérifier de fraîcheur : chaque exécution le reconstruit
      # depuis les sources, ci-dessous. C'est le bon choix — un artefact de
      # deux mégaoctets dans l'historique n'apporte rien —, mais il a une
      # conséquence à connaître : un dist/ resté sur un poste peut avoir des
      # semaines de retard sur js/ sans que rien ne le signale, et c'est ce
      # fichier-là qu'on ouvre en double-clic. Après avoir touché à js/,
      # relancer build-monofichier.py fait partie du geste.
      - name: Éditeur PCB — assemblage puis banc d'essai
        run: |
          # sans le module canvas, les essais du cuivre des plans (îlots, éclats) sont ignorés
          npm install --no-save --silent canvas
          python editeur-pcb/outils/build-monofichier.py
          node --check editeur-pcb/dist/pcb.js
          # un essai « ignoré » (canvas absent) sortait compté réussi : ici c'est un échec
          node editeur-pcb/test/harness.js | tee /tmp/banc-pcb.log
          if grep -n "essai ignoré" /tmp/banc-pcb.log; then exit 1; fi
          # hors CI jusqu'ici, il s'etait casse sans que rien ne le signale
          node editeur-pcb/test/banc-trois-ponts.js
          # la carte d'essai du crosstalk se regenere, toute routee et sans
          # remarque au DRC (ecrite a part : la carte versionnee ne bouge pas)
          node bancs-mesure/crosstalk/generer-carte.js /tmp/banc-crosstalk-PCB.json

      - name: Éditeur PCB — export IPC-2581, relu par la chaîne de la visionneuse
        run: |
          # Le banc de l'éditeur, juste au-dessus, a écrit ses exports dans
          # editeur-pcb/dist/essai-ipc2581/ : ils se relisent par le parseur de
          # la visionneuse, comme le banc d'essai du parseur. Le XSD de l'IPC
          # n'est pas dans le dépôt ; on prend la copie que KiCad garde pour ses
          # propres essais. Injoignable, la validation XSD est sautée et le
          # banc le dit -- le reste de l'aller-retour tourne quand même.
          # révision figée (KiCad 10.0.0), comme les démos plus bas
          pip install --quiet lxml || echo "::warning title=lxml non installé::validation XSD sautée"
          if curl -fsSL -o /tmp/IPC-2581C.xsd https://gitlab.com/kicad/code/kicad/-/raw/b0e9d3b0656e3770d11324b15e09b097f7fc33da/qa/data/pcbnew/ipc2581/IPC-2581C.xsd; then
            export IPC2581_XSD=/tmp/IPC-2581C.xsd
          else
            echo "::warning title=XSD IPC-2581 injoignable::validation XSD sautée"
          fi
          python editeur-pcb/test/banc-ipc2581-export.py

      # après l'export ci-dessus : deux de ses essais relisent editeur-pcb/dist/essai-ipc2581/,
      # et se sautaient en silence quand ce dossier n'existait pas encore
      - name: Visionneuse IPC-2581 — banc de la mesure de masse
        run: |
          # Pur JavaScript sur Node : ce banc lit les sources telles quelles,
          # sans assemblage ni dépendance. Il éprouve la GÉOMÉTRIE lue sur le
          # modèle -- où est le cuivre de masse, de quel côté, sur quelle
          # longueur --, là où banc-essai.py juste au-dessus éprouve le
          # parseur. Rien ne l'empêchait de tourner ici ; il n'y était pas.
          # même règle : un essai « sauté » faute d'export à relire est un échec ici
          node visionneuse-ipc2581/test/harness-sim.js | tee /tmp/banc-visionneuse.log
          if grep -n "(sauté" /tmp/banc-visionneuse.log; then exit 1; fi

      - name: Éditeur schématique — assemblage puis banc d'essai
        run: |
          python editeur-schematique/outils/build-monofichier.py
          node --check editeur-schematique/dist/schema.js
          node editeur-schematique/test/harness.js

      # Deux démos de KiCad 9 (révision figée), téléchargées : données étrangères,
      # lues par les convertisseurs, jamais exécutées. Injoignables, les bancs
      # tournent sur leurs seuls cas écrits à la main et le disent.
      - name: Projet KiCad — import et export (commun/kicad*.js)
        run: |
          REV=ce707d0a6c8736cbf4689560be4fee3d6a7f7f5e
          D=/tmp/kicad-demos
          for f in pic_programmer/pic_programmer.kicad_pro pic_programmer/pic_programmer.kicad_sch \
                   pic_programmer/pic_sockets.kicad_sch pic_programmer/pic_programmer.kicad_pcb \
                   complex_hierarchy/complex_hierarchy.kicad_pro complex_hierarchy/complex_hierarchy.kicad_sch \
                   complex_hierarchy/ampli_ht.kicad_sch complex_hierarchy/complex_hierarchy.kicad_pcb; do
            mkdir -p "$D/$(dirname $f)"
            curl -fsSL -o "$D/$f" "https://gitlab.com/kicad/code/kicad/-/raw/$REV/demos/$f" || { echo "::warning title=Démos KiCad injoignables::cas écrits à la main seulement"; rm -rf "$D"; mkdir -p "$D"; break; }
          done
          node commun/test/banc-kicad.js "$D"
          node commun/test/banc-kicad-pcb.js "$D"
          node commun/test/banc-kicad-sch.js "$D"

      - name: Le manuel et les règles servis (docs/manuel/manuel.html, docs/regles/regles.html) sont à jour
        run: |
          # la page du bouton « Manuel » est générée puis versionnée : un chapitre .md
          # modifié sans relancer le script laissait l'ancienne page (le script sort
          # aussi en erreur sur un lien cassé)
          python commun/outils/build-manuel.py
          git diff --exit-code --stat -- docs/manuel/manuel.html docs/regles/regles.html

      - name: Le monofichier doit être reproductible
        run: |
          # deux assemblages d'affilée donnent le même résultat : rien
          # d'horodaté ni d'aléatoire ne se glisse dans la sortie
          cp editeur-pcb/dist/pcb.js /tmp/pcb-1.js
          cp editeur-schematique/dist/schema.js /tmp/schema-1.js
          python editeur-pcb/outils/build-monofichier.py
          python editeur-schematique/outils/build-monofichier.py
          diff -q /tmp/pcb-1.js editeur-pcb/dist/pcb.js
          diff -q /tmp/schema-1.js editeur-schematique/dist/schema.js
