name: exécutables

# Compile l'exécutable Rust de WEB_CAO pour chaque système et les dépose dans la
# publication « binaires » : binaires.sh / binaires.cmd les y prennent sur les postes sans cargo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl : exécutables statiques, indépendants de la glibc du poste (Raspberry Pi OS)
          - { os: ubuntu-latest, cible: x86_64-unknown-linux-musl, nom: linux-x86_64 }
          - { os: ubuntu-24.04-arm, cible: aarch64-unknown-linux-musl, nom: linux-aarch64 }
          - { os: macos-latest, cible: aarch64-apple-darwin, nom: macos-aarch64 }
          - { os: windows-latest, cible: x86_64-pc-windows-msvc, nom: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0, épinglée : une étiquette se déplace

      - run: rustup target add ${{ matrix.cible }}

      - if: contains(matrix.cible, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # web_cao seul : les outils de construction et de comparaison des caisses ne se publient pas
      - run: cargo build --release --bin web_cao --target ${{ matrix.cible }}

      - name: Archive (l'exécutable et le commit dont il vient)
        shell: bash
        run: |
          mkdir bin
          cd target/${{ matrix.cible }}/release
          if [ "${{ runner.os }}" = Windows ]; then
            cp ./web_cao.exe ../../../bin/
          else
            cp ./web_cao ../../../bin/
          fi
          cd ../../..
          git rev-parse HEAD > bin/commit
          if [ "${{ runner.os }}" = Windows ]; then
            (cd bin && 7z a ../web_cao-${{ matrix.nom }}.zip .)
          else
            tar -czf web_cao-${{ matrix.nom }}.tar.gz -C bin .
          fi

      - name: Publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # les quatre compilations arrivent ensemble : une seule crée la publication
          gh release view binaires >/dev/null 2>&1 \
            || gh release create binaires --title "Exécutables" \
                 --notes "Exécutables de WEB_CAO, recompilés à chaque envoi sur main. Pris par binaires.sh et binaires.cmd." \
            || true
          gh release upload binaires web_cao-${{ matrix.nom }}.* --clobber
